<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How Memory Units Work Together</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Speed goes up as you move closer to the CPU, size goes down</text><rect x="40" y="120" width="180" height="120" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="130.0" y="165.54999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">CPU</text><text x="130.0" y="190.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">registers</text><text x="130.0" y="208.34999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">semiconductor, fastest</text><rect x="270" y="130" width="150" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="345.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Cache</text><text x="345.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">KB to a few MB</text><text x="345.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">frequent data</text><rect x="470" y="120" width="190" height="120" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="565.0" y="165.54999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="middle">RAM</text><text x="565.0" y="190.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">main memory, bytes</text><text x="565.0" y="208.34999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">fast but volatile</text><rect x="720" y="120" width="200" height="120" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="820.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Hard disk / SSD</text><text x="820.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">secondary memory, files</text><text x="820.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">slower, non-volatile</text><defs><marker id="m78920460" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="268" y1="180" x2="222" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m78920460)"/><defs><marker id="m17915943" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="468" y1="180" x2="422" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m17915943)"/><defs><marker id="m26980008" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="670" y1="160" x2="718" y2="160" stroke="#15803D" stroke-width="2" marker-end="url(#m26980008)"/><text x="694.0" y="152.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">saving</text><defs><marker id="m75830438" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="718" y1="205" x2="670" y2="205" stroke="#B45309" stroke-width="2" marker-end="url(#m75830438)"/><text x="694.0" y="225.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">loading</text><rect x="40" y="290" width="880" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="60" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">What the terms mean</text><text x="60" y="352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Register: tiny working space inside the CPU while it processes an instruction</text><text x="60" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Byte: the unit you talk about for RAM, where every running program must be loaded</text><text x="60" y="388" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">File: data stored permanently on the disk. Saving = RAM to disk, loading = disk to RAM</text><text x="60" y="406" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Volatile: RAM loses everything without power. The disk keeps data for years</text></svg>