<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">From Human Instructions to Binary</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The CPU only understands 0 and 1. Translators bridge the gap.</text><rect x="40" y="110" width="380" height="95" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="60" y="142" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">High level language</text><text x="60" y="172" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">total = a + b;  print(total)</text><text x="60" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">symbols and English-like commands</text><rect x="40" y="235" width="380" height="95" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="60" y="267" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">Assembly level language</text><text x="60" y="297" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">ADD   SUB   MUL   DIV</text><text x="60" y="319" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">mnemonics, easier than binary</text><rect x="560" y="160" width="210" height="120" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="665" y="195" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Machine level language</text><text x="665" y="228" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="middle">0101 0110 1010</text><text x="665" y="252" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="middle">0010 1110 0011</text><defs><marker id="m98041349" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="420" y1="157" x2="558" y2="195" stroke="#15803D" stroke-width="2" marker-end="url(#m98041349)"/><text x="489.0" y="168.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">compiler</text><defs><marker id="m75395080" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="420" y1="282" x2="558" y2="250" stroke="#B45309" stroke-width="2" marker-end="url(#m75395080)"/><text x="489.0" y="288.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">assembler</text><rect x="810" y="170" width="120" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="870.0" y="205.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">CPU</text><text x="870.0" y="230.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">runs only</text><text x="870.0" y="248.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">0s and 1s</text><defs><marker id="m10930369" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="770" y1="220" x2="808" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#m10930369)"/><text x="480" y="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">1950s: machine code  -&gt;  assembly mnemonics  -&gt;  1960s onwards: high level languages (C, C++, Java, Python)</text></svg>