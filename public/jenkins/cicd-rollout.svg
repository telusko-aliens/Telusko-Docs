<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Rolling Out a New Image Version</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">kubectl set image web-container=user/my-web-app:43, then kubectl rollout status</text><rect x="24" y="96" width="288" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="168" y="124" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Before</text><text x="168" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">ReplicaSet A (:42) = 2</text><rect x="68" y="166" width="200" height="34" rx="17.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="168.0" y="187.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">pod  my-web-app:42</text><rect x="68" y="214" width="200" height="34" rx="17.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="168.0" y="235.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">pod  my-web-app:42</text><defs><marker id="m58156977" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="314" y1="210" x2="334" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#m58156977)"/><rect x="336" y="96" width="288" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="480" y="124" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">During</text><text x="480" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">A scales down, B scales up</text><rect x="380" y="166" width="200" height="34" rx="17.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="480.0" y="187.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">pod  my-web-app:42</text><rect x="380" y="214" width="200" height="34" rx="17.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="480.0" y="235.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod  my-web-app:43</text><rect x="380" y="262" width="200" height="34" rx="17.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="480.0" y="283.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod  my-web-app:43</text><defs><marker id="m29754534" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="626" y1="210" x2="646" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#m29754534)"/><rect x="648" y="96" width="288" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="792" y="124" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">After</text><text x="792" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">ReplicaSet B (:43) = 2</text><rect x="692" y="166" width="200" height="34" rx="17.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="792.0" y="187.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod  my-web-app:43</text><rect x="692" y="214" width="200" height="34" rx="17.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="792.0" y="235.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod  my-web-app:43</text><text x="480" y="318" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">new pod must be Ready before an old one stops</text><rect x="24" y="344" width="912" height="74" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Same tag again (:latest) = same pod template = no rollout. A new tag changes the template, so Kubernetes</text><text x="44" y="394" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">creates a new ReplicaSet. Undo with: kubectl rollout undo deployment/web-app-deployment</text></svg>