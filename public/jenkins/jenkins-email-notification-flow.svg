<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How a Build Email Reaches You</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">post block -&gt; Email Extension plugin -&gt; SMTP server -&gt; inbox</text><rect x="30" y="120" width="180" height="120" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="120.0" y="156.15" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Pipeline run</text><text x="120.0" y="181.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">stages finish</text><text x="120.0" y="198.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">result: SUCCESS</text><text x="120.0" y="216.35" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">or FAILURE</text><rect x="250" y="120" width="190" height="120" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="345.0" y="164.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">post { }</text><text x="345.0" y="190.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">success { emailext }</text><text x="345.0" y="207.64999999999998" font-famil