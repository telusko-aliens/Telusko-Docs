<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of a Freestyle Job</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The configuration page is read top to bottom, and Jenkins runs it in the same order</text><rect x="24" y="110" width="138" height="140" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="93.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">General</text><text x="93.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">description</text><text x="93.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">parameters</text><text x="93.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">discard old builds</text><defs><marker id="m72334849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="163" y1="180" x2="179" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m72334849)"/><rect x="180" y="110" width="138" height="140" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="249.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Source Code Mgmt</text><text x="249.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Git repo URL</text><text x="249.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">branch: */main</text><text x="249.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">credentials</text><defs><marker id="m55810051" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="319" y1="180" x2="335" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m55810051)"/><rect x="336" y="110" width="138" height="140" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="405.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Triggers</text><text x="405.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">manual Build Now</text><text x="405.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">cron / Poll SCM</text><text x="405.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">GitHub webhook</text><defs><marker id="m40082651" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="475" y1="180" x2="491" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m40082651)"/><rect x="492" y="110" width="138" height="140" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="561.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Environment</text><text x="561.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">clean workspace</text><text x="561.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">timestamps</text><text x="561.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">timeouts</text><defs><marker id="m8646886" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="631" y1="180" x2="647" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m8646886)"/><rect x="648" y="110" width="138" height="140" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="717.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Build Steps</text><text x="717.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Execute shell</text><text x="717.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Invoke Maven</text><text x="717.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">targets: clean package</text><defs><marker id="m8830392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="787" y1="180" x2="803" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m8830392)"/><rect x="804" y="110" width="138" height="140" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="873.0" y="155.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Post-build</text><text x="873.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">archive artifacts</text><text x="873.0" y="198.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">email</text><text x="873.0" y="216.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">trigger next job</text><rect x="24" y="290" width="912" height="140" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="44" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">What happens when build #N runs</text><text x="44" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">1. Jenkins picks a free executor and creates /var/lib/jenkins/workspace/&lt;job-name&gt; if it does not exist</text><text x="44" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">2. The Git plugin clones or updates the repository into that workspace</text><text x="44" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">3. Build steps run one by one inside the workspace. The first step that fails marks the build FAILURE</text><text x="44" y="404" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">4. Post-build actions run, the result is recorded, and the full log is saved as Console Output</text></svg>