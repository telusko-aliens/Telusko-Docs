<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">One Pipeline vs Separate CI and CD</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">CI produces a tested, tagged image; CD deploys a given tag</text><text x="24" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Single pipeline</text><rect x="24" y="124" width="160" height="52" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="104.0" y="154.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Checkout</text><defs><marker id="m58205047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="186" y1="150" x2="206" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#m58205047)"/><rect x="208" y="124" width="160" height="52" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="288.0" y="154.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Maven build</text><defs><marker id="m86263216" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="370" y1="150" x2="390" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#m86263216)"/><rect x="392" y="124" width="160" height="52" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="472.0" y="154.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Docker build</text><defs><marker id="m88941797" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="554" y1="150" x2="574" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#m88941797)"/><rect x="576" y="124" width="160" height="52" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="656.0" y="154.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Push</text><defs><marker id="m51856791" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="738" y1="150" x2="758" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#m51856791)"/><rect x="760" y="124" width="160" height="52" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="840.0" y="154.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Deploy</text><text x="24" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Simple, but build and release are one unit: you cannot redeploy an old version without rebuilding it.</text><rect x="24" y="222" width="520" height="220" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="44" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">CI Pipeline (every commit)</text><rect x="44" y="262" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="60" y="284" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Checkout</text><rect x="44" y="304" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="60" y="326" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Maven build + tests</text><rect x="44" y="346" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="60" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Docker build :BUILD_NUMBER</text><rect x="44" y="388" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="60" y="410" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Docker push</text><rect x="364" y="290" width="162" height="100" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="445.0" y="315.45" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#D97757" text-anchor="middle">CD Trigger</text><text x="445.0" y="340.84999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">build job:</text><text x="445.0" y="358.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">'CD Pipeline'</text><text x="445.0" y="375.65" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">IMAGE_TAG=42</text><rect x="600" y="222" width="336" height="220" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">CD Pipeline (parameter IMAGE_TAG)</text><rect x="620" y="262" width="296" height="34" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="636" y="284" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="start">Checkout manifests</text><rect x="620" y="304" width="296" height="34" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="636" y="326" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="start">kubectl apply / set image :42</text><rect x="620" y="346" width="296" height="34" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="636" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="start">kubectl rollout status</text><defs><marker id="m93141950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><line x1="528" y1="340" x2="598" y2="340" stroke="#D97757" stroke-width="2" marker-end="url(#m93141950)"/><text x="768" y="408" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">can also be run by hand with an older tag</text><text x="768" y="426" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">to roll back</text></svg>