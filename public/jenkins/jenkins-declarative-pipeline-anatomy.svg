<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of a Declarative Pipeline</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Nested blocks: pipeline &gt; stages &gt; stage &gt; steps</text><rect x="30" y="100" width="470" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="48" y="126.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">pipeline {</text><text x="48" y="147.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    agent any</text><text x="48" y="169.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    tools {</text><text x="48" y="190.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">        maven 'maven'</text><text x="48" y="212.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    }</text><text x="48" y="233.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    stages {</text><text x="48" y="255.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">        stage('Git Clone') {</text><text x="48" y="276.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">            steps {</text><text x="48" y="298.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">                git branch: 'main', url: '...'</text><text x="48" y="319.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">            }</text><text x="48" y="341.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">        }</text><text x="48" y="362.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">        stage('Maven Build') {</text><text x="48" y="384.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">            steps { sh 'mvn clean package' }</text><text x="48" y="405.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">        }</text><text x="48" y="427.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    }</text><text x="48" y="448.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">    post { always { echo 'done' } }</text><text x="48" y="470.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">}</text><rect x="530" y="104" width="400" height="54" rx="10" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="546" y="127" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#D97757" text-anchor="start">pipeline</text><text x="546" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">the whole Jenkinsfile. Must be the outer block</text><rect x="530" y="166" width="400" height="54" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="546" y="189" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">agent</text><text x="546" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">where it runs: any, a label, a Docker image</text><rect x="530" y="228" width="400" height="54" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="546" y="251" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="start">tools</text><text x="546" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Jenkins tools put on the PATH (Manage Jenkins &gt; Tools)</text><rect x="530" y="290" width="400" height="54" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="546" y="313" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">stages / stage</text><text x="546" y="332" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">named phases, shown as boxes in the stage view</text><rect x="530" y="352" width="400" height="54" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="546" y="375" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">steps</text><text x="546" y="394" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">the real work: sh, git, echo, emailext ...</text><rect x="530" y="414" width="400" height="54" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="546" y="437" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">post</text><text x="546" y="456" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">runs after stages: always, success, failure ...</text></svg>