<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Build Triggers Compared</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Who starts the build, and how often Jenkins does work for nothing</text><text x="40" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Trigger</text><text x="250" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Configured with</text><text x="470" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Who starts it</text><text x="620" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Behaviour / best for</text><rect x="24" y="125" width="912" height="68" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="40" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">Build periodically</text><text x="250" y="165" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">cron: H 2 * * *</text><text x="470" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Jenkins clock</text><text x="620" y="155" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Builds on schedule, even if nothing changed</text><text x="620" y="175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">best for: nightly builds, reports</text><rect x="24" y="205" width="912" height="68" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="40" y="245" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">Poll SCM</text><text x="250" y="245" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">cron: H/5 * * * *</text><text x="470" y="245" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Jenkins asks Git</text><text x="620" y="235" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Builds only if a new commit is found</text><text x="620" y="255" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">best for: Jenkins not reachable from GitHub</text><rect x="24" y="285" width="912" height="68" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="40" y="325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">GitHub webhook</text><text x="250" y="325" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">&lt;jenkins&gt;/github-webhook/</text><text x="470" y="325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">GitHub calls Jenkins</text><text x="620" y="315" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Builds seconds after every push</text><text x="620" y="335" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">best for: the normal CI choice</text><rect x="24" y="365" width="912" height="68" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="40" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">Build after other projects</text><text x="250" y="405" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">upstream: java-app-build</text><text x="470" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Another job</text><text x="620" y="395" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Builds when the upstream job finishes</text><text x="620" y="415" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">best for: chaining CI -&gt; CD</text><rect x="24" y="445" width="912" height="68" rx="10" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="40" y="485" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Trigger builds remotely</text><text x="250" y="485" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">/job/&lt;name&gt;/build?token=</text><text x="470" y="485" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A script or tool</text><text x="620" y="475" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Builds when a URL is called</text><text x="620" y="495" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">best for: scripts, other systems</text></svg>