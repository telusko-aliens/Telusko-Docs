stem, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">Deploy</text><defs><marker id="m28818609" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="658" y1="232" x2="774" y2="232" stroke="#15803D" stroke-width="2" marker-end="url(#m28818609)"/><text x="715.0" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">time saved</text><rect x="30" y="330" width="900" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">A parallel stage finishes when its slowest branch finishes. If one branch fails, the stage fails.</text><text x="50" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">failFast true stops the other branches as soon as one fails. Only parallelise stages that do not need each other.</text></svg>