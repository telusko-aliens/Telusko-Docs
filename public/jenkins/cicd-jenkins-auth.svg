<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><rect x="0.5" y="0.5" width="959" height="499" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How the Pipeline Proves Who It Is</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Two different targets, two different kinds of credentials, no secrets in the Jenkinsfile</text><rect x="24" y="98" width="912" height="170" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="44" y="124" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">Docker Hub: a stored access token</text><rect x="44" y="140" width="200" height="106" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="144.0" y="177.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Jenkins credential</text><text x="144.0" y="202.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">id: dockerhub-creds</text><text x="144.0" y="220.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">username + access token</text><defs><marker id="m37051315" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="246" y1="193" x2="272" y2="193" stroke="#334155" stroke-width="2" marker-end="url(#m37051315)"/><rect x="274" y="140" width="200" height="106" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="374.0" y="177.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">withCredentials</text><text x="374.0" y="202.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">sets DOCKER_USER /</text><text x="374.0" y="220.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">DOCKER_PASS, masked in log</text><defs><marker id="m28678105" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="476" y1="193" x2="502" y2="193" stroke="#334155" stroke-width="2" marker-end="url(#m28678105)"/><rect x="504" y="140" width="200" height="106" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="604.0" y="177.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">docker login</text><text x="604.0" y="202.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">--password-stdin</text><text x="604.0" y="220.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">(token never on cmd line)</text><defs><marker id="m76396492" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="706" y1="193" x2="732" y2="193" stroke="#334155" stroke-width="2" marker-end="url(#m76396492)"/><rect x="734" y="140" width="200" height="106" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="834.0" y="177.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Docker Hub</text><text x="834.0" y="202.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">accepts push to</text><text x="834.0" y="220.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">user/my-web-app</text><rect x="24" y="286" width="912" height="190" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="44" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">Amazon EKS: an IAM role, no stored secret at all</text><rect x="44" y="328" width="200" height="106" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="144.0" y="365.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">kubectl</text><text x="144.0" y="390.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">reads /var/lib/jenkins/</text><text x="144.0" y="408.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">.kube/config</text><defs><marker id="m94950273" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="246" y1="381" x2="272" y2="381" stroke="#334155" stroke-width="2" marker-end="url(#m94950273)"/><rect x="274" y="328" width="200" height="106" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="374.0" y="365.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">aws eks get-token</text><text x="374.0" y="390.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">signed with the EC2</text><text x="374.0" y="408.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">instance role creds</text><defs><marker id="m71834421" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="476" y1="381" x2="502" y2="381" stroke="#334155" stroke-width="2" marker-end="url(#m71834421)"/><rect x="504" y="328" width="200" height="106" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="604.0" y="365.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">EKS API server</text><text x="604.0" y="390.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">checks the IAM role</text><text x="604.0" y="408.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">against access entries</text><defs><marker id="m71192879" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="706" y1="381" x2="732" y2="381" stroke="#334155" stroke-width="2" marker-end="url(#m71192879)"/><rect x="734" y="328" width="200" height="106" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="834.0" y="365.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Access entry</text><text x="834.0" y="390.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">role -&gt; AmazonEKS...</text><text x="834.0" y="408.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Policy (admin or edit)</text><text x="480" y="458" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Instance role credentials are temporary and rotate automatically. Nothing to copy, nothing to leak.</text></svg>