y="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- a new tag changes the Deployment -&gt; rollout</text><text x="518" y="336" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- roll back by deploying :42 again</text></svg>