<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><rect x="0.5" y="0.5" width="959" height="499" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of a Kubernetes Manifest</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Four top-level fields. Two are fixed by Kubernetes, two describe your object.</text><rect x="30" y="100" width="400" height="370" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="52.0" y="138" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">apiVersion: v1</text><text x="52.0" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="start">kind: Pod</text><text x="52.0" y="190" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">metadata:</text><text x="68.8" y="216" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#B45309" text-anchor="start">name: webapp</text><text x="68.8" y="242" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#B45309" text-anchor="start">labels:</text><text x="85.6" y="268" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#B45309" text-anchor="start">app: telusko-webapp</text><text x="52.0" y="294" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">spec:</text><text x="68.8" y="320" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#15803D" text-anchor="start">containers:</text><text x="85.6" y="346" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#15803D" text-anchor="start">- name: webapp-container</text><text x="102.4" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#15803D" text-anchor="start">image: &lt;user&gt;/springboot-app</text><text x="102.4" y="398" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#15803D" text-anchor="start">ports:</text><text x="119.2" y="424" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#15803D" text-anchor="start">- containerPort: 8080</text><rect x="500" y="100" width="430" height="80" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="520" y="128" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#2563EB" text-anchor="start">apiVersion</text><text x="520" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Which API group and version handles this kind</text><text x="520" y="169" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">e.g. v1, apps/v1, batch/v1</text><defs><marker id="m71502544" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="432" y1="133" x2="498" y2="140" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m71502544)"/><rect x="500" y="194" width="430" height="80" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="520" y="222" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">kind</text><text x="520" y="244" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The type of object, case sensitive</text><text x="520" y="263" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">e.g. Pod, Service, Deployment</text><defs><marker id="m23442299" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="432" y1="159" x2="498" y2="234" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m23442299)"/><rect x="500" y="288" width="430" height="80" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="520" y="316" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">metadata</text><text x="520" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Identity: name, namespace, labels, annotations</text><text x="520" y="357" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">e.g. name is required</text><defs><marker id="m98999946" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="432" y1="185" x2="498" y2="328" stroke="#B45309" stroke-width="1.5" marker-end="url(#m98999946)"/><rect x="500" y="382" width="430" height="80" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="520" y="410" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">spec</text><text x="520" y="432" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Desired state. Shape depends on the kind</text><text x="520" y="451" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">e.g. containers, replicas, ports...</text><defs><marker id="m5323136" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="432" y1="289" x2="498" y2="422" stroke="#15803D" stroke-width="1.5" marker-end="url(#m5323136)"/><text x="715" y="488" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">status is added by Kubernetes later. You never write it.</text></svg>