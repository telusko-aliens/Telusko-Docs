<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">DaemonSet vs Deployment</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">A DaemonSet runs exactly one pod per node. Add a node and it gets one automatically.</text><rect x="40" y="110" width="270" height="230" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="175" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">node 1</text><rect x="60" y="156" width="230" height="60" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="175.0" y="179.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">DaemonSet pod</text><text x="175.0" y="204.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">e.g. log agent, monitoring</text><rect x="60" y="240" width="110" height="56" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="115.0" y="261.575" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">app pod</text><text x="115.0" y="285.525" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">Deployment</text><rect x="180" y="240" width="110" height="56" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="235.0" y="261.575" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">app pod</text><text x="235.0" y="285.525" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">Deployment</text><rect x="340" y="110" width="270" height="230" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="475" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">node 2</text><rect x="360" y="156" width="230" height="60" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="475.0" y="179.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">DaemonSet pod</text><text x="475.0" y="204.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">e.g. log agent, monitoring</text><rect x="360" y="240" width="110" height="56" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="415.0" y="261.575" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">app pod</text><text x="415.0" y="285.525" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">Deployment</text><rect x="640" y="110" width="270" height="230" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6,4"/><text x="775" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">node 3 (just added)</text><rect x="660" y="156" width="230" height="60" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="775.0" y="179.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">DaemonSet pod</text><text x="775.0" y="204.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">e.g. log agent, monitoring</text><text x="775" y="274" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">scheduler may place app pods here later</text><text x="480" y="372" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Deployment: N replicas placed wherever there is room.  DaemonSet: one per node, no replica count.</text></svg>