<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Job vs CronJob</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">A Job runs a task to completion. A CronJob creates a Job on a schedule.</text><rect x="30" y="100" width="440" height="350" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="250" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Job: completions and parallelism</text><text x="50" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">non-parallel-job: completions 3, parallelism 1</text><rect x="50" y="172" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="110.0" y="191.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 1: done</text><defs><marker id="m63369299" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="171" y1="187" x2="183" y2="187" stroke="#334155" stroke-width="1.5" marker-end="url(#m63369299)"/><rect x="185" y="172" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="245.0" y="191.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 2: done</text><defs><marker id="m42544232" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="306" y1="187" x2="318" y2="187" stroke="#334155" stroke-width="1.5" marker-end="url(#m42544232)"/><rect x="320" y="172" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="380.0" y="191.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 3: done</text><text x="50" y="225" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">one after another (ages 14s, 7s, 3s)</text><text x="50" y="265" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">parallel-job: completions 6, parallelism 3</text><rect x="50" y="277" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="110.0" y="296.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 1: done</text><rect x="185" y="277" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="245.0" y="296.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 2: done</text><rect x="320" y="277" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="380.0" y="296.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 3: done</text><rect x="50" y="317" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="110.0" y="336.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 4: done</text><rect x="185" y="317" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="245.0" y="336.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 5: done</text><rect x="320" y="317" width="120" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="380.0" y="336.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 6: done</text><text x="50" y="375" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">three at a time, two waves</text><text x="50" y="410" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">restartPolicy: Never or OnFailure</text><text x="50" y="430" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">backoffLimit: 6 retries by default</text><rect x="500" y="100" width="430" height="350" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="715" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">CronJob: telusko-cronjob</text><rect x="590" y="145" width="250" height="60" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="715.0" y="168.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">CronJob</text><text x="715.0" y="193.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">schedule: */1 * * * *</text><defs><marker id="m59993824" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="715" y1="207" x2="715" y2="232" stroke="#7C3AED" stroke-width="2" marker-end="url(#m59993824)"/><text x="725" y="225" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">every minute creates</text><rect x="520" y="235" width="120" height="50" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="580.0" y="264.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Job 1</text><defs><marker id="m75398808" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="580" y1="287" x2="580" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m75398808)"/><rect x="530" y="312" width="100" height="28" rx="14.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="580.0" y="330.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="660" y="235" width="120" height="50" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="720.0" y="264.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Job 2</text><defs><marker id="m34666278" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="720" y1="287" x2="720" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m34666278)"/><rect x="670" y="312" width="100" height="28" rx="14.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="720.0" y="330.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="800" y="235" width="120" height="50" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="860.0" y="264.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Job 3</text><defs><marker id="m90020209" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="860" y1="287" x2="860" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m90020209)"/><rect x="810" y="312" width="100" height="28" rx="14.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="330.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><text x="520" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">successfulJobsHistoryLimit: 3 (keep last 3)</text><text x="520" y="392" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">failedJobsHistoryLimit: 1</text><text x="520" y="412" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">timeZone: Asia/Kolkata (else controller's zone)</text></svg>