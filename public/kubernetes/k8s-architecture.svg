<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Kubernetes Architecture at a Glance</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">One control plane makes decisions. Worker nodes run your pods.</text><rect x="30" y="230" width="130" height="90" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="95.0" y="259.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">kubectl</text><text x="95.0" y="285.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">you, on your</text><text x="95.0" y="302.65000000000003" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">laptop or EC2</text><rect x="200" y="100" width="300" height="420" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="350" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Control plane (the brain)</text><text x="350" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">on EKS: run and managed by AWS</text><rect x="220" y="162" width="260" height="72" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="350.0" y="191.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">kube-apiserver</text><text x="350.0" y="216.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">front door, every request</text><rect x="220" y="248" width="260" height="72" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="350.0" y="277.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">etcd</text><text x="350.0" y="302.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">key-value store of cluster state</text><rect x="220" y="334" width="260" height="72" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="350.0" y="363.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">kube-scheduler</text><text x="350.0" y="388.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">picks a node for new pods</text><rect x="220" y="420" width="260" height="72" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="350.0" y="449.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">kube-controller-manager</text><text x="350.0" y="474.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">desired state = actual state</text><defs><marker id="m55550098" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></de