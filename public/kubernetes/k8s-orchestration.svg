<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Running Containers by Hand vs With an Orchestrator</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The containers are the same. What changes is who looks after them.</text><rect x="30" y="100" width="430" height="350" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="245" y="130" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="middle">Docker alone, many servers</text><rect x="50" y="150" width="124" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/><text x="112" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">server 1</text><rect x="60" y="184" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="112.0" y="198.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="60" y="211" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="112.0" y="225.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="60" y="238" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="112.0" y="252.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="186" y="150" width="124" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/><text x="248" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">server 2</text><rect x="196" y="184" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="248.0" y="198.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="196" y="211" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="248.0" y="225.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="196" y="238" width="104" height="22" rx="11.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="248.0" y="252.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">crashed</text><rect x="322" y="150" width="124" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/><text x="384" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">server 3</text><rect x="332" y="184" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="384.0" y="198.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="332" y="211" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="384.0" y="225.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><rect x="332" y="238" width="104" height="22" rx="11.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="384.0" y="252.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">container</text><text x="52" y="302" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Who restarts the crashed container at 2 AM?</text><text x="52" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Which server has free CPU for 10 more copies?</text><text x="52" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- How do users reach a container that moved?</text><text x="52" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- How do you update 500 containers safely?</text><text x="245" y="430" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">you are the scheduler, the monitor and the load balancer</text><rect x="500" y="100" width="430" height="350" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="715" y="130" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="middle">Kubernetes cluster</text><rect x="560" y="145" width="310" height="62" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="715.0" y="169.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Control plane</text><text x="715.0" y="194.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">you say: I want 9 copies of my app</text><rect x="520" y="232" width="124" height="92" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="582" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">node 1</text><rect x="530" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="546.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="566" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="582.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="602" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="618.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><text x="582" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">healthy</text><defs><marker id="m48913945" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="715" y1="209" x2="582" y2="230" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m48913945)"/><rect x="656" y="232" width="124" height="92" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="718" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">node 2</text><rect x="666" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="682.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="702" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="718.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><rect x="738" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="754.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">pod</text><text x="718" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">healthy</text><defs><marker id="m22971994" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="715" y1="209" x2="718" y2="230" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m22971994)"/><rect x="792" y="232" width="124" height="92" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="854" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">node 3</text><rect x="802" y="266" width="32" height="22" rx="11.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="818.0" y="280.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text