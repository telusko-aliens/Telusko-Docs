<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Getting Configuration into a Pod</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Same image everywhere. Settings arrive at runtime from ConfigMaps and Secrets.</text><rect x="30" y="110" width="230" height="110" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="145.0" y="140.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">ConfigMap: dbvars</text><text x="145.0" y="166.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">non-sensitive key=value</text><text x="145.0" y="183.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">LOG_LEVEL, DB_HOST, PORT</text><text x="145.0" y="201.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">stored as plain text</text><rect x="30" y="250" width="230" height="110" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="145.0" y="280.79999999999995" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">Secret: my-secret</text><text x="145.0" y="306.19999999999993" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">sensitive key=value</text><text x="145.0" y="323.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">passwords, tokens, keys</text><text x="145.0" y="340.99999999999994" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">stored base64 encoded</text><rect x="380" y="100" width="300" height="300" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="530" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Pod (mariadb container)</text><rect x="400" y="150" width="260" height="100" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="530.0" y="175.45000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">As environment variables</text><text x="530.0" y="200.85000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">env / envFrom</text><text x="530.0" y="218.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">read once when the</text><text x="530.0" y="235.65" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">container starts</text><rect x="400" y="275" width="260" height="105" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="530.0" y="302.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">As files in a volume</text><text x="530.0" y="328.34999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/etc/config/&lt;key&gt;</text><text x="530.0" y="345.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">updated in place when</text><text x="530.0" y="363.15" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the ConfigMap/Secret changes</text><defs><marker id="m99510630" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="262" y1="160" x2="398" y2="190" stroke="#2563EB" stroke-width="2" marker-end="url(#m99510630)"/><defs><marker id="m78198761" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="262" y1="175" x2="398" y2="315" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#m78198761)"/><defs><marker id="m14889244" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="262" y1="300" x2="398" y2="215" stroke="#B91C1C" stroke-width="2" marker-end="url(#m14889244)"/><defs><marker id="m81785882" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="262" y1="320" x2="398" y2="335" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#m81785882)"/><rect x="720" y="100" width="210" height="300" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="825" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Ways to set env</text><text x="738" y="158" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">kubectl set env</text><text x="738" y="176" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  deploy/mydb KEY=val</text><text x="738" y="194" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start"></text><text x="738" y="212" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">kubectl set env</text><text x="738" y="230" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  deploy/newdb</text><text x="738" y="248" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  --from=configmap/dbvars</text><text x="738" y="266" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start"></text><text x="738" y="284" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">YAML: env.valueFrom</text><text x="738" y="302" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  .configMapKeyRef /</text><text x="738" y="320" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  .secretKeyRef</text><text x="738" y="338" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start"></text><text x="738" y="356" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">YAML: envFrom (all keys)</text><text x="480" y="440" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">base64 is encoding, not encryption: anyone who can read the Secret can decode it.</text></svg>