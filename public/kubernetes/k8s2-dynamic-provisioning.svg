<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Dynamic Provisioning with a StorageClass</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">You ask for storage. The CSI driver creates the EBS volume and the PV for you.</text><rect x="30" y="110" width="166" height="150" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><rect x="98.0" y="122" width="30" height="26" rx="13.0" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="113.0" y="139.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#D97757" text-anchor="middle">1</text><text x="113.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">PVC created</text><text x="113.0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">from the StatefulSet's</text><text x="113.0" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">volumeClaimTemplates</text><defs><marker id="m7700164" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="197" y1="185" x2="215" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#m7700164)"/><rect x="216" y="110" width="166" height="150" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><rect x="284.0" y="122" width="30" height="26" rx="13.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="299.0" y="139.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">2</text><text x="299.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">StorageClass</text><text x="299.0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">ebs-sc: provisioner</text><text x="299.0" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">ebs.csi.aws.com, gp3</text><defs><marker id="m92600571" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="383" y1="185" x2="401" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#m92600571)"/><rect x="402" y="110" width="166" height="150" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><rect x="470.0" y="122" width="30" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="485.0" y="139.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">3</text><text x="485.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Pod scheduled</text><text x="485.0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">WaitForFirstConsumer:</text><text x="485.0" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">zone of the node is known</text><defs><marker id="m38403553" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="569" y1="185" x2="587" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#m38403553)"/><rect x="588" y="110" width="166" height="150" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><rect x="656.0" y="122" width="30" height="26" rx="13.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="671.0" y="139.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">4</text><text x="671.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">CSI driver</text><text x="671.0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">calls EC2 CreateVolume</text><text x="671.0" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">in that same zone</text><defs><marker id="m56104686" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="755" y1="185" x2="773" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#m56104686)"/><rect x="774" y="110" width="166" height="150" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><rect x="842.0" y="122" width="30" height="26" rx="13.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="857.0" y="139.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">5</text><text x="857.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">PV + bind</text><text x="857.0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">PV created, bound to</text><text x="857.0" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the PVC, disk mounted</text><rect x="30" y="285" width="430" height="120" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="50" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Static (previous lesson)</text><text x="50" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">You create the EBS volume in the console,</text><text x="50" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">copy its ID into a PV, then write a PVC.</text><text x="50" y="378" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">One disk at a time, all by hand.</text><rect x="500" y="285" width="430" height="120" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="520" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">Dynamic (this lesson)</text><text x="520" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">You write only a StorageClass and a PVC (or a</text><text x="520" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">volumeClaimTemplate). Scale to 5 replicas and</text><text x="520" y="378" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">5 volumes appear on their own.</text></svg>