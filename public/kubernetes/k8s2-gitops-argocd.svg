<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">GitOps with Argo CD</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Git holds the desired state. Argo CD keeps the cluster equal to it.</text><rect x="30" y="160" width="160" height="90" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="110.0" y="189.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Developer</text><text x="110.0" y="214.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">edits YAML,</text><text x="110.0" y="232.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">git commit + push</text><rect x="250" y="150" width="200" height="110" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="350.0" y="180.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Git repository</text><text x="350.0" y="206.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">argocd.yml</text><text x="350.0" y="223.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">replicas: 4 -&gt; 8</text><text x="350.0" y="241.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">single source of truth</text><defs><marker id="m81231343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="192" y1="205" x2="248" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#m81231343)"/><text x="220.0" y="197.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">push</text><rect x="510" y="100" width="200" height="260" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="610" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#D97757" text-anchor="middle">Argo CD</text><text x="610" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">namespace argocd</text><rect x="525" y="160" width="170" height="54" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="610.0" y="180.57500000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">repo-server</text><text x="610.0" y="204.525" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">renders manifests</text><rect x="525" y="224" width="170" height="54" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="610.0" y="244.57500000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">app controller</text><text x="610.0" y="268.52500000000003" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">compares + syncs</text><rect x="525" y="288" width="170" height="54" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="610.0" y="308.575" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">argocd-server</text><text x="610.0" y="332.525" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">UI and API</text><defs><marker id="m64580468" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="452" y1="190" x2="508" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#m64580468)"/><text x="480" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">poll</text><rect x="770" y="100" width="160" height="260" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">EKS cluster</text><rect x="790" y="145" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="161.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><rect x="790" y="179" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="195.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><rect x="790" y="213" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="229.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><rect x="790" y="247" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="263.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><rect x="790" y="281" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="297.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><rect x="790" y="315" width="120" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="850.0" y="331.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">product pod</text><defs><marker id="m14961522" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><line x1="712" y1="230" x2="768" y2="230" stroke="#D97757" stroke-width="2" marker-end="url(#m14961522)"/><text x="740.0" y="222.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">sync</text><defs><marker id="m47109840" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="768" y1="300" x2="712" y2="300" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#m47109840)"/><text x="740" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">drift</text><rect x="30" y="380" width="900" height="46" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="480" y="409" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Synced = live state matches Git.  OutOfSync = they differ.  Self-heal undoes manual kubectl changes.</text></svg>