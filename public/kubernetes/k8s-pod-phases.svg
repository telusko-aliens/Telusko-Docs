<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Pod Phases and the Statuses You See in kubectl</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">status.phase has five values. The STATUS column often shows a more specific reason.</text><rect x="30" y="160" width="150" height="80" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="105.0" y="185.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Pending</text><text x="105.0" y="210.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">accepted, not</text><text x="105.0" y="228.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">running yet</text><rect x="260" y="160" width="150" height="80" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="335.0" y="185.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Running</text><text x="335.0" y="210.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">bound to a node,</text><text x="335.0" y="228.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">a container is up</text><rect x="520" y="100" width="170" height="80" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="605.0" y="125.19999999999999" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">Succeeded</text><text x="605.0" y="150.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">all containers</text><text x="605.0" y="168.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">exited with 0</text><rect x="520" y="220" width="170" height="80" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="605.0" y="245.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">Failed</text><text x="605.0" y="270.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">a container exited</text><text x="605.0" y="288.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">non-zero, no restart</text><rect x="780" y="160" width="150" height="80" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="855.0" y="185.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Unknown</text><text x="855.0" y="210.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">node not</text><text x="855.0" y="228.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">reachable</text><defs><marker id="m23913482" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="182" y1="200" x2="258" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#m23913482)"/><text x="220" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">scheduled,</text><text x="220" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">started</text><defs><marker id="m80358308" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="412" y1="190" x2="518" y2="145" stroke="#15803D" stroke-width="2" marker-end="url(#m80358308)"/><defs><marker id="m86122513" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="412" y1="212" x2="518" y2="255" stroke="#B91C1C" stroke-width="2" marker-end="url(#m86122513)"/><defs><marker id="m31152639" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="692" y1="200" x2="778" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#m31152639)"/><text x="735" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">lost contact</text><text x="735" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">with node</text><text x="105" y="268" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#B45309" text-anchor="middle">ContainerCreating</text><text x="105" y="286" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#B45309" text-anchor="middle">ErrImagePull, ImagePullBackOff</text><text x="335" y="268" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#2563EB" text-anchor="middle">CrashLoopBackOff</text><text x="335" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">(phase stays Running)</text><text x="605" y="92" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#15803D" text-anchor="middle">Completed</text><text x="605" y="322" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#B91C1C" text-anchor="middle">Error, OOMKilled</text><rect x="30" y="350" width="900" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="480" y="376" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">Pending is also where a pod waits when no node has enough CPU or memory (FailedScheduling).</text><text x="480" y="398" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">Terminating is not a phase: it is shown while a deleted pod shuts down gracefully.</text></svg>