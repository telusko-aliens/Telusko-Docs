<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Stateless vs Stateful Applications</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The question is simple: does it matter which pod answers?</text><rect x="30" y="100" width="430" height="345" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="245" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">Stateless (Deployment)</text><rect x="165" y="145" width="160" height="48" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="245.0" y="173.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Load balancer</text><defs><marker id="m36375732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="245" y1="195" x2="112" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#m36375732)"/><rect x="50" y="230" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="112" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Spring Boot</text><text x="112" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">deploy-7f9c-x2k</text><defs><marker id="m79985140" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="245" y1="195" x2="248" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#m79985140)"/><rect x="186" y="230" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/><text x="248" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">Spring Boot</text><text x="248" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">deploy-7f9c-p8q</text><defs><marker id="m74193955" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="245" y1="195" x2="384" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#m74193955)"/><rect x="322" y="230" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="384" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Spring Boot</text><text x="384" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">deploy-7f9c-zt4</text><text x="186" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">crashed, replaced by deploy-7f9c-m1w</text><text x="50" y="352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Any pod can serve any request</text><text x="50" y="374" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- New pod gets a new random name: nobody cares</text><text x="50" y="396" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Nothing important is kept inside the pod</text><text x="50" y="418" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Examples: React, Node.js, Spring Boot REST API</text><rect x="500" y="100" width="430" height="345" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="715" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="middle">Stateful (StatefulSet)</text><rect x="520" y="150" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="582" y="174" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">MySQL</text><text x="582" y="196" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">mysql-0</text><defs><marker id="m47444122" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="582" y1="222" x2="582" y2="248" stroke="#B45309" stroke-width="1.5" marker-end="url(#m47444122)"/><rect x="532" y="250" width="100" height="46" rx="8" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="582" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">own disk</text><text x="582" y="287" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">data-mysql-0</text><rect x="656" y="150" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="718" y="174" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">MySQL</text><text x="718" y="196" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">mysql-1</text><defs><marker id="m66973681" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="718" y1="222" x2="718" y2="248" stroke="#B45309" stroke-width="1.5" marker-end="url(#m66973681)"/><rect x="668" y="250" width="100" height="46" rx="8" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="718" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">own disk</text><text x="718" y="287" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">data-mysql-1</text><rect x="792" y="150" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="854" y="174" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">MySQL</text><text x="854" y="196" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">mysql-2</text><defs><marker id="m90340857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="854" y1="222" x2="854" y2="248" stroke="#B45309" stroke-width="1.5" marker-end="url(#m90340857)"/><rect x="804" y="250" width="100" height="46" rx="8" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="854" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">own disk</text><text x="854" y="287" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">data-mysql-2</text><text x="715" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">mysql-1 restarts as mysql-1, with the same disk</text><text x="520" y="352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Each pod holds data others depend on</text><text x="520" y="374" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Name and address must stay the same</text><text x="520" y="396" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Created and removed in a fixed order</text><text x="520" y="418" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">- Examples: MySQL, PostgreSQL, Kafka, Cassandra</text></svg>