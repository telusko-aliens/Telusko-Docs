<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">What Happens When You Create a Pod</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Each component watches the API server and does one small job</text><rect x="25" y="130" width="140" height="150" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><rect x="80.0" y="142" width="30" height="26" rx="13.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="95.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">1</text><text x="95.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">kubectl apply</text><text x="95.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">sends the YAML to</text><text x="95.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the API server</text><defs><marker id="m5184410" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="166" y1="205" x2="179" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m5184410)"/><rect x="180" y="130" width="140" height="150" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><rect x="235.0" y="142" width="30" height="26" rx="13.0" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="250.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#D97757" text-anchor="middle">2</text><text x="250.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">API server</text><text x="250.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">authenticates,</text><text x="250.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">validates, saves</text><text x="250.0" y="256" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">to etcd</text><defs><marker id="m4749778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="321" y1="205" x2="334" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m4749778)"/><rect x="335" y="130" width="140" height="150" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><rect x="390.0" y="142" width="30" height="26" rx="13.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="405.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">3</text><text x="405.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Scheduler</text><text x="405.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">sees a pod with no</text><text x="405.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">node, picks one</text><defs><marker id="m49835534" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="476" y1="205" x2="489" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m49835534)"/><rect x="490" y="130" width="140" height="150" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><rect x="545.0" y="142" width="30" height="26" rx="13.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="560.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">4</text><text x="560.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">kubelet</text><text x="560.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">on that node sees</text><text x="560.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the new pod</text><defs><marker id="m38102586" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="631" y1="205" x2="644" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m38102586)"/><rect x="645" y="130" width="140" height="150" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><rect x="700.0" y="142" width="30" height="26" rx="13.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="715.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">5</text><text x="715.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">containerd</text><text x="715.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">pulls the image,</text><text x="715.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">starts container</text><defs><marker id="m55934256" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="786" y1="205" x2="799" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m55934256)"/><rect x="800" y="130" width="140" height="150" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><rect x="855.0" y="142" width="30" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="870.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">6</text><text x="870.0" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Status</text><text x="870.0" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">kubelet reports</text><text x="870.0" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Running to the API</text><rect x="25" y="305" width="910" height="110" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="45" y="333" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">Meanwhile, the controller manager keeps checking:</text><text x="45" y="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">desired state (what you wrote in YAML, stored in etcd)  vs  actual state (what is running).</text><text x="45" y="381" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">If they differ, for example a pod of a ReplicaSet dies, a controller creates a replacement and the</text><text x="45" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">same scheduler -&gt; kubelet -&gt; runtime steps run again. This loop is what people call self-healing.</text></svg>