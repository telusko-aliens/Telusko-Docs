<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How the Horizontal Pod Autoscaler Decides</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">A control loop that runs every 15 seconds</text><rect x="30" y="120" width="200" height="90" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="149.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">kubelet (cAdvisor)</text><text x="130.0" y="174.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">on every node: CPU and</text><text x="130.0" y="192.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">memory of each pod</text><rect x="290" y="120" width="200" height="90" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="390.0" y="149.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">metrics-server</text><text x="390.0" y="174.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">collects and serves</text><text x="390.0" y="192.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">metrics.k8s.io API</text><rect x="550" y="120" width="200" height="90" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="650.0" y="149.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">HPA controller</text><text x="650.0" y="174.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">in kube-controller-manager</text><text x="650.0" y="192.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">compares with target</text><rect x="550" y="290" width="200" height="90" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="650.0" y="319.15000000000003" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Deployment telusko-app</text><text x="650.0" y="344.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">spec.replicas changed</text><text x="650.0" y="361.95000000000005" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">(min 2, max 10)</text><defs><marker id="m13702786" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="232" y1="165" x2="288" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m13702786)"/><text x="260.0" y="157.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">scrape</text><defs><marker id="m91491481" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="492" y1="165" x2="548" y2="165" stroke="#7C3AED" stroke-width="2" marker-end="url(#m91491481)"/><text x="520.0" y="157.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">query</text><defs><marker id="m33287830" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><line x1="650" y1="212" x2="650" y2="288" stroke="#D97757" stroke-width="2" marker-end="url(#m33287830)"/><text x="660" y="255" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">scale</text><rect x="30" y="270" width="470" height="170" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="50" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">The formula</text><text x="50" y="325" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">desired = ceil( current x currentUsage / target )</text><text x="50" y="355" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">3 pods at 80% CPU, target 20%:  ceil(3 x 80 / 20) = 12 -&gt; capped at 10</text><text x="50" y="377" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Usage is a % of the pod's CPU request (100m here).</text><text x="50" y="399" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">No request set = HPA cannot compute a percentage.</text><rect x="790" y="120" width="140" height="260" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">pods</text><rect x="805" y="160" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="176.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-0</text><rect x="805" y="194" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="210.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-1</text><rect x="805" y="228" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="244.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-2</text><rect x="805" y="262" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="278.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-3</text><rect x="805" y="296" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="312.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-4</text><rect x="805" y="330" width="110" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="860.0" y="346.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">telusko-app-5</text><defs><marker id="m22722617" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="752" y1="335" x2="788" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#m22722617)"/><text x="860" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">scale in waits 5 min</text><text x="860" y="421" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">(stabilization window)</text></svg>