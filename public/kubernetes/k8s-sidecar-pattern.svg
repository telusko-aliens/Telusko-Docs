<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">The Sidecar Pattern</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Two containers in one pod share a volume and the same network address</text><rect x="160" y="100" width="640" height="280" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="480" y="126" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Pod (one IP, scheduled together)</text><rect x="190" y="150" width="230" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="305.0" y="184.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">app container</text><text x="305.0" y="210.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">main application</text><text x="305.0" y="227.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">writes /var/log/app.log</text><rect x="540" y="150" width="230" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="655.0" y="184.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">sidecar container</text><text x="655.0" y="210.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-seri