<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">ResourceQuota: a Budget per Namespace</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The API server rejects any pod that would push the namespace over its budget</text><rect x="30" y="100" width="560" height="310" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="310" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">namespace dev   (dev-quota: pods 5, limits.cpu 1, limits.memory 1Gi)</text><text x="50" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">Attempt 1: 3 replicas x limits.cpu 1</text><rect x="50" y="175" width="150" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="125.0" y="194.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 1: 1 CPU</text><rect x="215" y="175" width="150" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="290.0" y="194.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">pod 2: rejected</text><rect x="380" y="175" width="150" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="455.0" y="194.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">pod 3: rejected</text><text x="50" y="228" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="start">1 + 1 = 2 CPU &gt; 1 CPU quota: exceeded quota</text><text x="50" y="272" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">Attempt 2: 3 replicas x limits.cpu 300m</text><rect x="50" y="285" width="150" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="125.0" y="304.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 1: 300m</text><rect x="215" y="285" width="150" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="290.0" y="304.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 2: 300m</text><rect x="380" y="285" width="150" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="455.0" y="304.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">pod 3: 300m</text><text x="50" y="338" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#475569" text-anchor="start">300m x 3 = 900m &lt;= 1000m: all three admitted</text><text x="50" y="380" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Used / hard:  kubectl describe quota dev-quota -n dev</text><rect x="620" y="100" width="310" height="310" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="775" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Other namespaces</text><rect x="640" y="145" width="270" height="66" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="775.0" y="171.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">testing</text><text x="775.0" y="196.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">own quota, or none</text><rect x="640" y="227" width="270" height="66" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="775.0" y="253.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">ai-team</text><text x="775.0" y="278.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">own quota, or none</text><rect x="640" y="309" width="270" height="66" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="775.0" y="335.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">default</text><text x="775.0" y="360.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">own quota, or none</text></svg>