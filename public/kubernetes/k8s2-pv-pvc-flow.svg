<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How a Pod Reaches Real Storage</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The pod never talks to the disk directly. Each layer has one job.</text><rect x="30" y="110" width="160" height="110" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="110.0" y="149.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Application</text><text x="110.0" y="175.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">writes files to</text><text x="110.0" y="192.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/tmp/persistent</text><defs><marker id="m35637922" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="192" y1="165" x2="214" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m35637922)"/><rect x="216" y="110" width="160" height="110" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="296.0" y="149.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Pod</text><text x="296.0" y="175.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">volumeMounts +</text><text x="296.0" y="192.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">volumes: claimName</text><defs><marker id="m7431239" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="378" y1="165" x2="400" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m7431239)"/><rect x="402" y="110" width="160" height="110" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="482.0" y="149.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">PVC</text><text x="482.0" y="175.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the request:</text><text x="482.0" y="192.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">"I need 20Gi, RWO"</text><defs><marker id="m46884814" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="564" y1="165" x2="586" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m46884814)"/><rect x="588" y="110" width="160" height="110" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="668.0" y="149.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">PV</text><text x="668.0" y="175.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">cluster object that</text><text x="668.0" y="192.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">represents the disk</text><defs><marker id="m76989530" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="750" y1="165" x2="772" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m76989530)"/><rect x="774" y="110" width="160" height="110" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="854.0" y="149.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">AWS EBS volume</text><text x="854.0" y="175.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the real disk,</text><text x="854.0" y="192.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">vol-0abc..., 20 GiB</text><text x="110" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">your code</text><text x="389" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">written by the app team</text><text x="668" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">admin or StorageClass</text><text x="854" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">lives outside the cluster</text><rect x="30" y="270" width="900" height="108" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="50" y="298" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Think of a laptop and an external hard disk</text><text x="50" y="324" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The pod is the laptop: it can break and be replaced at any time.</text><text x="50" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The EBS volume is the external disk: plug it into the new pod and your files are still there.</text><text x="50" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The PV and PVC are the cable and the label that tell Kubernetes which disk goes to which pod.</text></svg>