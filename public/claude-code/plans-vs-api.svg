<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Two Ways to Pay for Claude Code</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Pick based on how much you use it and how predictable you want the bill</text><rect x="30" y="100" width="435" height="230" rx="14" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="247" y="135" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">Subscription (Pro, Max, Team)</text><text x="55" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Log in with your claude.ai account</text><text x="55" y="198" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Fixed monthly price</text><text x="55" y="226" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Usage limit per session window and per week</text><text x="55" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Wait for reset, or turn on usage credits</text><text x="55" y="282" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Best for daily interactive use</text><rect x="495" y="100" width="435" height="230" rx="14" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="712" y="135" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="middle">API (Claude Console)</text><text x="520" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Log in with a Console account or API key</text><text x="520" y="198" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Pay per million tokens used</text><text x="520" y="226" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">No plan limit, but rate limits and balance apply</text><text x="520" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Opus spends credit fastest, Haiku slowest</text><text x="520" y="282" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Best for scripts, CI and pay-as-you-go</text></svg>