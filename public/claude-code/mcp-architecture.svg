<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Model Context Protocol (MCP)</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">One standard plug between AI tools and external services, like USB for AI</text><rect x="30" y="110" width="250" height="300" rx="14" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="155" y="142" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#D97757" text-anchor="middle">Claude Code</text><rect x="55" y="165" width="200" height="40" rx="20.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="155.0" y="189.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">MCP client (built in)</text><text x="60" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Discovers what each</text><text x="60" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">server offers, then calls</text><text x="60" y="284" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">its tools when a task</text><text x="60" y="306" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">needs them</text><rect x="470" y="105" width="230" height="64" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="585.0" y="130.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">GitHub MCP server</text><text x="585.0" y="155.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">issues, PRs, branches, files</text><rect x="330" y="121" width="110" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="139.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">HTTP (remote)</text><defs><marker id="m8950167" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="280" y1="260" x2="328" y2="136" stroke="#E2E8F0" stroke-width="1.5" marker-end="url(#m8950167)"/><defs><marker id="m11981816" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="440" y1="136" x2="468" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#m11981816)"/><rect x="470" y="183" width="230" height="64" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="585.0" y="208.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Postgres / DB server</text><text x="585.0" y="233.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">run queries</text><rect x="330" y="199" width="110" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="217.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">stdio (local)</text><defs><marker id="m68138204" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="280" y1="260" x2="328" y2="214" stroke="#E2E8F0" stroke-width="1.5" marker-end="url(#m68138204)"/><defs><marker id="m7826154" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="440" y1="214" x2="468" y2="214" stroke="#334155" stroke-width="2" marker-end="url(#m7826154)"/><rect x="470" y="261" width="230" height="64" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="585.0" y="286.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Playwright server</text><text x="585.0" y="311.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">drive a browser</text><rect x="330" y="277" width="110" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="295.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">stdio (local)</text><defs><marker id="m63000422" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="280" y1="260" x2="328" y2="292" stroke="#E2E8F0" stroke-width="1.5" marker-end="url(#m63000422)"/><defs><marker id="m18173534" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="440" y1="292" x2="468" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#m18173534)"/><rect x="470" y="339" width="230" height="64" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="585.0" y="364.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Slack / Notion / Jira</text><text x="585.0" y="389.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">messages, docs, tickets</text><rect x="330" y="355" width="110" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="373.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">HTTP (remote)</text><defs><marker id="m77650912" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="280" y1="260" x2="328" y2="370" stroke="#E2E8F0" stroke-width="1.5" marker-end="url(#m77650912)"/><defs><marker id="m22472105" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="440" y1="370" x2="468" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#m22472105)"/><rect x="740" y="110" width="190" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="835" y="142" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">A server exposes</text><rect x="760" y="165" width="150" height="65" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="835.0" y="190.70000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Tools</text><text x="835.0" y="216.10000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">actions to call</text><rect x="760" y="245" width="150" height="65" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="835.0" y="270.7" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Resources</text><text x="835.0" y="296.09999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">data to read</text><rect x="760" y="325" width="150" height="65" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="835.0" y="350.7" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Prompts</text><text x="835.0" y="376.09999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">ready templates</text><text x="480" y="445" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">SSE transport is deprecated. Use HTTP for remote servers and stdio for local processes.</text></svg>