minal</text><text x="520" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Every command and setting available</text><text x="520" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Settings &gt; Claude Code &gt; Use Terminal</text></svg>