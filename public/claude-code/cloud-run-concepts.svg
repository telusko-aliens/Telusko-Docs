, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">container</text><defs><marker id="m94025351" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="470" y1="130" x2="668" y2="130" stroke="#E2E8F0" stroke-width="1.2" marker-end="url(#m94025351)"/><rect x="800" y="100" width="115" height="60" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="857.5" y="123.575" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Instance 3</text><text x="857.5" y="147.52499999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">container</text><defs><marker id="m86237536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker></defs><line x1="470" y1="130" x2="798" y2="130" stroke="#E2E8F0" stroke-width="1.2" marker-end="url(#m86237536)"/><rect x="540" y="185" width="375" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5,4"/><text x="727" y="215" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">no traffic: scales down to zero instances</text><rect x="30" y="270" width="900" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="300" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">What this means for our app</text><text x="50" y="326" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Each deploy creates a new revision. You can roll back in the console</text><text x="50" y="348" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Instances are disposable, so files written inside a container (like our SQLite file) do not persist</text></svg>