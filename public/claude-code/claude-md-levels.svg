<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Where CLAUDE.md Files Live</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">All matching files are loaded and combined, from broadest to most specific</text><rect x="30" y="100" width="900" height="56" rx="10" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="48" y="134" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Managed policy</text><text x="200" y="125" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">/etc/claude-code/CLAUDE.md  or  C:\Program Files\ClaudeCode\CLAUDE.md</text><text x="200" y="145" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Whole organisation, set by IT</text><rect x="50" y="166" width="860" height="56" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="68" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">User</text><text x="220" y="191" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">~/.claude/CLAUDE.md</text><text x="220" y="211" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">You, in every project</text><rect x="70" y="