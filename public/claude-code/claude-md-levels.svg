s there</text><defs><marker id="m61303965" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><line x1="945" y1="110" x2="945" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#m61303965)"/><text x="480" y="455" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Later files appear later in context. Keep them consistent: on a conflict Claude may follow either.</text></svg>