<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Which Claude Code Feature Should I Use?</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Match the problem to the tool. Most projects start with CLAUDE.md.</text><rect x="30" y="100" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Claude keeps forgetting a rule or a convention</text><defs><marker id="m48780151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="126" x2="640" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#m48780151)"/><rect x="645" y="106" width="150" height="40" rx="20.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="720.0" y="130.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">CLAUDE.md</text><text x="810" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">always loaded</text><rect x="30" y="166" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="198" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">I keep typing the same long prompt or checklist</text><defs><marker id="m42702656" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="192" x2="640" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#m42702656)"/><rect x="645" y="172" width="150" height="40" rx="20.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="720.0" y="196.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#15803D" text-anchor="middle">Skill</text><text x="810" y="198" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">loaded when used</text><rect x="30" y="232" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">A side task floods my context with output</text><defs><marker id="m62923238" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="258" x2="640" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#m62923238)"/><rect x="645" y="238" width="150" height="40" rx="20.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="720.0" y="262.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#7C3AED" text-anchor="middle">Sub-agent</text><text x="810" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">own context window</text><rect x="30" y="298" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">I need data or actions from another system</text><defs><marker id="m26012514" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="324" x2="640" y2="324" stroke="#334155" stroke-width="2" marker-end="url(#m26012514)"/><rect x="645" y="304" width="150" height="40" rx="20.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="720.0" y="328.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#B45309" text-anchor="middle">MCP server</text><text x="810" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">GitHub, DB, Slack...</text><rect x="30" y="364" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="396" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Something must happen every time, no exceptions</text><defs><marker id="m1083518" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="390" x2="640" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#m1083518)"/><rect x="645" y="370" width="150" height="40" rx="20.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="720.0" y="394.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#B91C1C" text-anchor="middle">Hook</text><text x="810" y="396" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">runs automatically</text><rect x="30" y="430" width="560" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="462" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">I need two experiments that must not collide</text><defs><marker id="m4542376" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="590" y1="456" x2="640" y2="456" stroke="#334155" stroke-width="2" marker-end="url(#m4542376)"/><rect x="645" y="436" width="150" height="40" rx="20.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="720.0" y="460.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Worktree</text><text x="810" y="462" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">separate folder + branch</text><text x="480" y="505" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">They combine: a skill can run in a sub-agent, a sub-agent can use MCP tools.</text></svg>