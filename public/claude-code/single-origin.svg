<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">From Two Origins to One</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">FastAPI serves the API and the frontend from the same URL</text><rect x="30" y="100" width="435" height="230" rx="14" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="247" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">Before: local development</text><rect x="55" y="160" width="170" height="70" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="140.0" y="188.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Frontend</text><text x="140.0" y="213.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">:8080 static server</text><rect x="270" y="160" width="170" height="70" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="355.0" y="188.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">FastAPI</text><text x="355.0" y="213.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">:8000 /api/*</text><defs><marker id="m88879806" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="225" y1="195" x2="268" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#m88879806)"/><text x="55" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Two servers, two ports</text><text x="55" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Hardcoded http://localhost:8000</text><text x="55" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">CORS rules needed</text><rect x="495" y="100" width="435" height="230" rx="14" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="712" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">After: ready for Cloud Run</text><rect x="530" y="160" width="365" height="70" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="712.5" y="188.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">FastAPI on one port ($PORT, default 8080)</text><text x="712.5" y="213.60000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/api/* routers first, then / static frontend</text><text x="530" y="270" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">One container, one URL</text><text x="530" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Relative URLs like /api/tasks</text><text x="530" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">No CORS problems</text></svg>