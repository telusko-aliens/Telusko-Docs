<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Why the Static Mount Must Come Last</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">FastAPI checks routes in the order they were registered</text><rect x="30" y="100" width="435" height="270" rx="14" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="247" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">Correct: routers first</text><rect x="55" y="155" width="385" height="36" rx="18.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="247.5" y="177.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">1. /api/auth/*  -&gt; auth router</text><rect x="55" y="200" width="385" height="36" rx="18.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="247.5" y="222.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">2. /api/tasks/* -&gt; tasks router</text><rect x="55" y="245" width="385" height="36" rx="18.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="247.5" y="267.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">3. /  -&gt; StaticFiles (frontend)</text><text x="55" y="310" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">GET /api/tasks  -&gt;  matched at step 2, returns JSON</text><text x="55" y="335" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">GET /  -&gt;  matched at step 3, returns index.html</text><rect x="495" y="100" width="435" height="270" rx="14" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="712" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">Wrong: static mount first</text><rect x="520" y="155" width="385" height="36" rx="18.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="712.5" y="177.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">1. /  -&gt; StaticFiles (catches everything)</text><rect x="520" y="200" width="385" height="36" rx="18.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="712.5" y="222.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">2. /api/auth/*  (never reached)</text><rect x="520" y="245" width="385" height="36" rx="18.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="712.5" y="267.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">3. /api/tasks/* (never reached)</text><text x="520" y="310" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">GET /api/tasks  -&gt;  looks for a file</text><text x="520" y="335" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">named api/tasks  -&gt;  404, API broken</text></svg>