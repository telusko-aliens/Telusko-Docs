<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Docker Layer Caching</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Order instructions from least to most frequently changed</text><rect x="30" y="100" width="560" height="50" rx="8" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="50" y="131" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">FROM python:3.12-slim</text><text x="570" y="131" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">changes almost never</text><rect x="30" y="162" width="560" height="50" rx="8" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="50" y="193" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">COPY uv binary</text><text x="570" y="193" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">changes almost never</text><rect x="30" y="224" width="560" height="50" rx="8" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="50" y="255" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">COPY pyproject.toml + install deps</text><text x="570" y="255" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">changes when you add a package</text><rect x="30" y="286" width="560" height="50" rx="8" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="50" y="317" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">COPY backend/app, alembic, seed.py</text><text x="570" y="317" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">changes on every code edit</text><rect x="30" y="348" width="560" height="50" rx="8" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="50" y="379" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">COPY specs/ and frontend/</text><text x="570" y="379" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">changes often</text><rect x="620" y="100" width="310" height="298" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="775" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">You edit task_service.py</text><text x="640" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Layers 1 to 3: reused</text><text x="640" y="187" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">from cache, instant</text><text x="640" y="209" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start"></text><text x="640" y="231" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Layers 4 and 5: rebuilt,</text><text x="640" y="253" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">a few seconds</text><text x="640" y="275" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start"></text><text x="640" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Deps were installed before</text><text x="640" y="319" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">the code was copied, so</text><text x="640" y="341" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">they are not reinstalled</text><text x="480" y="440" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">If you copied all the code first, every edit would trigger a full dependency install.</text></svg>