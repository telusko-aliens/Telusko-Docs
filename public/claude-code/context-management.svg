<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><rect x="0.5" y="0.5" width="959" height="459" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Managing the Context Window</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Check /context regularly and act before it fills up</text><rect x="355" y="95" width="250" height="70" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="480.0" y="123.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Context filling up?</text><text x="480.0" y="150.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">run /context</text><rect x="30" y="230" width="270" height="110" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="165.0" y="259.325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Same task</text><text x="165.0" y="286.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">/compact keep the API</text><text x="165.0" y="305.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">contract and open bugs</text><text x="165.0" y="323.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">(summary, session continues)</text><rect x="345" y="230" width="270" height="110" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="480.0" y="259.325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">New, unrelated task</text><text x="480.0" y="286.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">/clear</text><text x="480.0" y="305.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">or start a new session</text><text x="480.0" y="323.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">(CLAUDE.md still loads)</text><rect x="660" y="230" width="270" height="110" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="795.0" y="259.325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Quick side question</text><text x="795.0" y="286.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">/btw &lt;question&gt;</text><text x="795.0" y="305.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">answer is not added</text><text x="795.0" y="323.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">to the conversation</text><defs><marker id="m40388926" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="400" y1="165" x2="165" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#m40388926)"/><defs><marker id="m6872287" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="480" y1="165" x2="480" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#m6872287)"/><defs><marker id="m73007998" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="560" y1="165" x2="795" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#m73007998)"/><rect x="30" y="370" width="900" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="480" y="398" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Rule of thumb: one session per feature. Do not wait until the window is completely full.</text><text x="480" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Name sessions with /rename so you can find them later with /resume.</text></svg>