or (broke it)</text><circle cx="870" cy="160" r="14" fill="#EEF2F6" stroke="#334155" stroke-width="2.5"/><text x="870" y="130" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Now</text><defs><marker id="m45897505" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><path d="M820,205 Q610,270 400,205" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#m45897505)"/><text x="610.0" y="271.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Esc Esc  or  /rewind</text><rect x="60" y="290" width="840" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="480" y="321" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">Restore code, conversation, or both. Files changed through shell commands (rm, mv, cp) and remote systems are not tracked.</text></svg>