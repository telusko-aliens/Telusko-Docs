<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">A Healthy Session, Start to Finish</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">One feature, one session. Name it, watch it, close it.</text><rect x="30" y="110" width="138" height="100" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="99.0" y="153.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Start</text><text x="99.0" y="178.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">claude or /clear</text><defs><marker id="m78301354" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="168" y1="160" x2="181" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m78301354)"/><rect x="183" y="110" width="138" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="252.0" y="153.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Name</text><text x="252.0" y="178.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/rename feature-x</text><defs><marker id="m33605979" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="321" y1="160" x2="334" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m33605979)"/><rect x="336" y="110" width="138" height="100" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="405.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Work</text><text x="405.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">prompts, /diff,</text><text x="405.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">check /context</text><defs><marker id="m85130605" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="474" y1="160" x2="487" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m85130605)"/><rect x="489" y="110" width="138" height="100" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="558.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Compact</text><text x="558.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/compact &lt;keep&gt;</text><text x="558.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">if it grows</text><defs><marker id="m4544010" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="627" y1="160" x2="640" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m4544010)"/><rect x="642" y="110" width="138" height="100" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="711.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">Finish</text><text x="711.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">commit, merge,</text><text x="711.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/exit</text><defs><marker id="m82822173" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="780" y1="160" x2="793" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m82822173)"/><rect x="795" y="110" width="138" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="864.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">Return</text><text x="864.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">/resume feature-x</text><text x="864.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">or --continue</text><text x="480" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Made a mess? /rewind or Esc Esc restores code and conversation to an earlier prompt.</text><text x="480" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Trying an alternative without losing this path? /branch forks the conversation.</text></svg>