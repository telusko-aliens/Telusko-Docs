<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How a Skill Runs</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Shell commands in !`...` run first, so Claude reads real data, not commands</text><rect x="30" y="110" width="200" height="110" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="141.15" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">/telusko-status</text><text x="130.0" y="166.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">you type the command</text><text x="130.0" y="183.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">(or Claude picks the skill</text><text x="130.0" y="201.35" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">from its description)</text><rect x="280" y="100" width="260" height="130" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="410.0" y="132.45" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">SKILL.md</text><text x="410.0" y="157.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">frontmatter: description,</text><text x="410.0" y="