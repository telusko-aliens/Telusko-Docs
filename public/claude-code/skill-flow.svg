p</text><text x="610" y="328" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">## Recent commits</text><text x="610" y="350" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">ce14669 Merge branch ...</text><text x="480" y="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">If any injected command is not allowed, the whole skill aborts with a permission error.</text></svg>