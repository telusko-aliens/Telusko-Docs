<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><rect x="0.5" y="0.5" width="959" height="329" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How an Alembic Migration Works</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Change the model, let Alembic write the SQL, apply it everywhere</text><rect x="30" y="110" width="160" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="110.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">1. Edit model</text><text x="110.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">models/task.py</text><text x="110.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">add or change a column</text><defs><marker id="m96867298" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="190" y1="160" x2="212" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m96867298)"/><rect x="214" y="110" width="160" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="294.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">2. Autogenerate</text><text x="294.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">alembic revision</text><text x="294.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">--autogenerate</text><defs><marker id="m54217921" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="374" y1="160" x2="396" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m54217921)"/><rect x="398" y="110" width="160" height="100" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="478.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">3. Review script</text><text x="478.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">alembic/versions/</text><text x="478.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">read upgrade()</text><defs><marker id="m29474963" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="558" y1="160" x2="580" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m29474963)"/><rect x="582" y="110" width="160" height="100" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="662.0" y="153.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">4. Apply</text><text x="662.0" y="178.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">alembic upgrade head</text><defs><marker id="m90216754" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="742" y1="160" x2="764" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m90216754)"/><rect x="766" y="110" width="160" height="100" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="846.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">5. Database</text><text x="846.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">tables match</text><text x="846.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the models</text><text x="480" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The alembic_version table remembers which migrations ran, so upgrade only applies new ones.</text><text x="480" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Undo the last one with: alembic downgrade -1</text></svg>