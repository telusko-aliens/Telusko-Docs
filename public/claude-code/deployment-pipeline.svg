family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">auth, APIs</text><defs><marker id="m81842775" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="627" y1="160" x2="640" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m81842775)"/><rect x="642" y="110" width="138" height="100" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="711.0" y="144.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">5. Cloud Build</text><text x="711.0" y="169.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">builds image</text><text x="711.0" y="187.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">pushes to registry</text><defs><marker id="m94514167" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="780" y1="160" x2="793" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m94514167)"/><rect x="795" y="110" width="138" height="100" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="864.0" y="144.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">6. Cloud Run</text><text x="864.0" y="169.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">serves HTTPS</text><text x="864.0" y="187.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">public URL</text><rect x="30" y="250" width="900" height="140" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="280" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Google Cloud pieces</text><rect x="50" y="300" width="270" height="36" rx="18.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="185.0" y="322.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">Cloud Build: builds the image</text><rect x="345" y="300" width="270" height="36" rx="18.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="480.0" y="322.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7C3AED" text-anchor="middle">Artifact Registry: stores it</text><rect x="640" y="300" width="270" height="36" rx="18.0" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="775.0" y="322.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D97757" text-anchor="middle">Cloud Run: runs containers</text><text x="480" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Same image everywhere: if it works in Docker on your machine, it should work on Cloud Run.</text></svg>