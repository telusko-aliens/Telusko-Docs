<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of a JWT</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Three Base64URL parts joined by dots: header.payload.signature</text><rect x="30" y="95" width="900" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="480" y="126" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle"><tspan fill="#B91C1C">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</tspan><tspan fill="#0F172A">.</tspan><tspan fill="#7C3AED">eyJzdWIiOiJlZGl0b3IiLCJyb2xl ... MjI1NjAwfQ</tspan><tspan fill="#0F172A">.</tspan><tspan fill="#2563EB">J9YMGCRU ... Qzbi8s</tspan></text><rect x="30" y="175" width="280" height="190" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="170.0" y="234.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">Header</text><text x="170.0" y="261.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">which algorithm signed it</text><text x="170.0" y="280.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"></text><text x="170.0" y="299.45" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">{"alg": "HS256",</text><text x="170.0" y="318.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"> "typ": "JWT"}</text><rect x="340" y="175" width="280" height="190" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="480.0" y="225.475" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Payload (claims)</text><text x="480.0" y="252.325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">{"sub": "editor",</text><text x="480.0" y="271.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"> "role": "video_editor",</text><text x="480.0" y="290.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"> "exp": 1767225600}</text><text x="480.0" y="308.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"></text><text x="480.0" y="327.725" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">readable by anyone</text><rect x="650" y="175" width="280" height="190" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="790.0" y="225.475" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Signature</text><text x="790.0" y="252.325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">HMAC-SHA256 of</text><text x="790.0" y="271.175" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">header + payload</text><text x="790.0" y="290.025" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">using SECRET_KEY</text><text x="790.0" y="308.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle"></text><text x="790.0" y="327.725" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">changes if anything changes</text><text x="480" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Not encrypted, only signed. Never put passwords or secrets in the payload.</text></svg>