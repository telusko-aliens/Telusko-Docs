<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><rect x="0.5" y="0.5" width="959" height="329" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">JAR vs WAR</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">The packaging element decides what mvn package produces</text><rect x="30" y="100" width="430" height="205" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="245" y="132" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">&lt;packaging&gt;jar&lt;/packaging&gt;</text><text x="55" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Archetype: maven-archetype-quickstart</text><text x="55" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Output: target/telusko-app-1.0-SNAPSHOT.jar</text><text x="55" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Inside: com/telusko/*.class, META-INF/</text><text x="55" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Runs with: java -cp app.jar com.telusko.App</text><text x="55" y="280" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Used for: libraries, CLI tools, Spring Boot</text><rect x="500" y="100" width="430" height="205" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="715" y="132" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">&lt;packaging&gt;war&lt;/packaging&gt;</text><text x="525" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Archetype: maven-archetype-webapp</text><text x="525" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Output: target/telusko-web-app.war</text><text x="525" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Inside: index.jsp, WEB-INF/ (web.xml, classes, lib)</text><text x="525" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Runs in: a servlet container such as Tomcat</text></svg>