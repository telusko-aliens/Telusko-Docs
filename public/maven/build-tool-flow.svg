<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">What a Build Tool Automates</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Everything after writing the code is the build. Maven runs it with one command.</text><rect x="30" y="130" width="150" height="100" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Write code</text><text x="105.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">App.java</text><text x="105.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">developer</text><defs><marker id="m28397628" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="182" y1="180" x2="218" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m28397628)"/><rect x="220" y="130" width="150" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="295.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Compile</text><text x="295.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">.java -&gt; .class</text><text x="295.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">javac</text><defs><marker id="m43235079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="372" y1="180" x2="408" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m43235079)"/><rect x="410" y="130" width="150" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="485.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Test</text><text x="485.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">run unit tests</text><text x="485.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">JUnit</text><defs><marker id="m87183381" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="562" y1="180" x2="598" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m87183381)"/><rect x="600" y="130" width="150" height="100" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="675.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Package</text><text x="675.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">bundle classes</text><text x="675.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">and resources</text><defs><marker id="m19225049" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="752" y1="180" x2="788" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m19225049)"/><rect x="790" y="130" width="150" height="100" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="865.0" y="165.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">Artifact</text><text x="865.0" y="190.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">app.jar or</text><text x="865.0" y="208.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">app.war</text><rect x="210" y="250" width="550" height="44" rx="10" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><line x1="485.0" y1="232" x2="485.0" y2="249" stroke="#D97757" stroke-width="2" stroke-dasharray="4,3"/><text x="485.0" y="278" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#D97757" text-anchor="middle">mvn package  (one command does compile + test + package)</text><rect x="30" y="320" width="900" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="343" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Plus dependency management:</text><text x="50" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Maven downloads the library JARs your code imports (Spring, Hibernate, JDBC drivers) and puts them on the classpath.</text></svg>