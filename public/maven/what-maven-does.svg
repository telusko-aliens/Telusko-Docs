<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">What Maven Does for a Java Project</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">You describe the project in pom.xml. Maven does the rest.</text><rect x="370" y="170" width="220" height="110" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="480.0" y="209.45000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#D97757" text-anchor="middle">pom.xml</text><text x="480.0" y="236.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">what you want</text><text x="480.0" y="255.15" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">from Maven</text><rect x="40" y="110" width="220" height="100" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="150.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Project structure</text><text x="150.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">src/main, src/test,</text><text x="150.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">resources, target</text><rect x="40" y="290" width="220" height="100" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="150.0" y="324.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">Dependencies</text><text x="150.0" y="350.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">downloads JARs and</text><text x="150.0" y="367.65000000000003" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">adds them to the classpath</text><rect x="700" y="110" width="220" height="100" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="810.0" y="144.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Compile and test</text><text x="810.0" y="170.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">javac + unit tests</text><text x="810.0" y="187.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">on every build</text><rect x="700" y="290" width="220" height="100" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="810.0" y="324.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Package</text><text x="810.0" y="350.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">JAR for standalone apps,</text><text x="810.0" y="367.65000000000003" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">WAR for web apps</text><defs><marker id="m84979438" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="368" y1="200" x2="262" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m84979438)"/><defs><marker id="m15658550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="368" y1="250" x2="262" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#m15658550)"/><defs><marker id="m83137330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="592" y1="200" x2="698" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#m83137330)"/><defs><marker id="m47541782" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="592" y1="250" x2="698" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#m47541782)"/><text x="480" y="410" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Apache Maven: free, open source, maintained by the Apache Software Foundation</text></svg>