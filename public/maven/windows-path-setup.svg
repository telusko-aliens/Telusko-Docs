<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How Windows Finds java and mvn</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">PATH is the list of folders Windows searches when you type a command</text><rect x="30" y="130" width="180" height="90" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="120.0" y="168.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Command Prompt</text><text x="120.0" y="193.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">you type: mvn -v</text><rect x="260" y="100" width="380" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="280" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Environment variables</text><text x="280" y="158" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">JAVA_HOME = C:\Program Files\Java\jdk-21</text><text x="280" y="184" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">MAVEN_HOME = C:\apache-maven-3.10.0  (optional)</text><text x="280" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Path += %JAVA_HOME%\bin</text><text x="280" y="236" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Path += C:\apache-maven-3.10.0\bin</text><rect x="700" y="95" width="230" height="80" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="815.0" y="128.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">mvn.cmd</text><text x="815.0" y="153.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">found in Maven's bin folder</text><rect x="700" y="190" width="230" height="80" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="815.0" y="223.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">java.exe</text><text x="815.0" y="248.95000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">Maven uses JAVA_HOME</text><defs><marker id="m66122114" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="212" y1="175" x2="258" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m66122114)"/><defs><marker id="m14873124" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="642" y1="160" x2="698" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#m14873124)"/><defs><marker id="m18355405" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="642" y1="200" x2="698" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#m18355405)"/><text x="480" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">Open a NEW terminal after editing variables. Old windows keep the old PATH.</text></svg>