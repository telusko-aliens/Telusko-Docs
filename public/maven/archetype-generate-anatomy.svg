<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of mvn archetype:generate</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Each -D flag passes one property to the archetype plugin</text><rect x="30" y="100" width="420" height="50" rx="8" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="46" y="131" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">archetype:generate</text><text x="470" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">plugin:goal</text><text x="470" y="141" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">run the generate goal of the Archetype plugin</text><rect x="30" y="160" width="420" height="50" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="46" y="191" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-DgroupId=com.telusko</text><text x="470" y="182" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">groupId</text><text x="470" y="201" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">company or organisation, reverse domain name; also the Java package</text><rect x="30" y="220" width="420" height="50" rx="8" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="46" y="251" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-DartifactId=telusko-app</text><text x="470" y="242" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">artifactId</text><text x="470" y="261" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">project name; becomes the folder name and the JAR name</text><rect x="30" y="280" width="420" height="50" rx="8" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="46" y="311" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-DarchetypeArtifactId=maven-archetype-quickstart</text><text x="470" y="302" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">template</text><text x="470" y="321" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">which project template to copy (quickstart = plain Java JAR)</text><rect x="30" y="340" width="420" height="50" rx="8" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="46" y="371" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-DarchetypeVersion=1.5</text><text x="470" y="362" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">template version</text><text x="470" y="381" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">version of the template itself, not of your project</text><rect x="30" y="400" width="420" height="50" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="46" y="431" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-DinteractiveMode=false</text><text x="470" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start">batch mode</text><text x="470" y="441" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">do not prompt for values, use the ones given here</text></svg>