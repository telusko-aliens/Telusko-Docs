<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How Maven Works</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">pom.xml says what. Plugins do the work. Repositories supply the JARs.</text><rect x="30" y="150" width="170" height="110" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="115.0" y="191.65" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#D97757" text-anchor="middle">pom.xml</text><text x="115.0" y="215.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">coordinates, dependencies,</text><text x="115.0" y="231.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">plugins, packaging</text><rect x="260" y="150" width="170" height="110" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="345.0" y="192.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">mvn</text><text x="345.0" y="215.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">reads the POM and</text><text x="345.0" y="231.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">runs lifecycle phases</text><rect x="490" y="120" width="190" height="80" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="585.0" y="154.275" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Plugins</text><text x="585.0" y="178.225" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">compiler, surefire, jar, war</text><rect x="490" y="225" width="190" height="80" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="585.0" y="258.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Local repository</text><text x="585.0" y="283.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">~/.m2/repository</text><rect x="740" y="225" width="190" height="80" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="835.0" y="258.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Maven Central</text><text x="835.0" y="283.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">repo.maven.apache.org</text><rect x="740" y="120" width="190" height="80" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="835.0" y="154.275" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">target/</text><text x="835.0" y="178.225" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">classes, reports, app.jar</text><defs><marker id="m66159867" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="202" y1="205" x2="258" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m66159867)"/><text x="230.0" y="197.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">read</text><defs><marker id="m58803407" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="432" y1="185" x2="488" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m58803407)"/><defs><marker id="m44296687" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="432" y1="225" x2="488" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#m44296687)"/><defs><marker id="m29228401" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="682" y1="160" x2="738" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m29228401)"/><text x="710.0" y="152.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">output</text><defs><marker id="m14218744" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="738" y1="265" x2="682" y2="265" stroke="#B45309" stroke-width="2" marker-end="url(#m14218744)"/><text x="835" y="325" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">downloaded only if missing locally</text><rect x="30" y="350" width="900" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="50" y="376" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Plugins and dependencies are both just artifacts in a repository.</text><text x="50" y="398" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The first build downloads them into ~/.m2. Later builds reuse the local copy, so they are faster and work offline.</text></svg>