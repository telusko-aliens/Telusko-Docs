<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img"><rect x="0.5" y="0.5" width="959" height="379" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Two Ways to Set Up Maven for This Course</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Pick one. Every Maven command after setup is the same on both.</text><rect x="30" y="100" width="430" height="250" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="245" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Option 1: your own machine</text><text x="55" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">1. Install JDK 17 or 21</text><text x="55" y="191" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">2. Download apache-maven-x.y.z-bin.zip</text><text x="55" y="217" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">3. Extract it, set JAVA_HOME</text><text x="55" y="243" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">4. Add JDK bin and Maven bin to PATH</text><text x="55" y="269" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">5. Verify with mvn -v</text><text x="55" y="315" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Best if you have no AWS account</text><rect x="500" y="100" width="430" height="250" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="715" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Option 2: Linux VM on AWS EC2</text><text x="525" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">1. Launch an Amazon Linux 2023 instance</text><text x="525" y="191" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">2. SSH in with your key pair</text><text x="525" y="217" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">3. sudo dnf install -y maven  (Java comes with it)</text><text x="525" y="243" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">4. Verify with mvn -v and java -version</text><text x="525" y="315" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Same result on any laptop OS. Stop it after practice</text></svg>