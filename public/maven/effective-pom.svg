<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How Maven Builds the Effective POM</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Maven merges several POMs in memory. The result is what it really uses.</text><rect x="30" y="110" width="200" height="90" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="141.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Super POM</text><text x="130.0" y="165.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">built into Maven</text><text x="130.0" y="181.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">central repo, src/main/java</text><rect x="30" y="215" width="200" height="90" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="130.0" y="246.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">Parent POM</text><text x="130.0" y="270.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">optional, e.g.</text><text x="130.0" y="286.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">spring-boot-starter-parent</text><rect x="280" y="160" width="200" height="90" rx="12" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/><text x="380.0" y="191.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#D97757" text-anchor="middle">Your pom.xml</text><text x="380.0" y="215.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">coordinates, dependencies,</text><text x="380.0" y="231.20000000000002" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">your overrides win</text><rect x="560" y="140" width="160" height="130" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="640.0" y="181.15" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Effective POM</text><text x="640.0" y="206.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">full merged model</text><text x="640.0" y="223.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">in memory, not</text><text x="640.0" y="241.35" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">a file on disk</text><rect x="780" y="160" width="150" height="90" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="855.0" y="189.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Build</text><text x="855.0" y="215.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">compile, test,</text><text x="855.0" y="232.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">package</text><defs><marker id="m55082050" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="232" y1="155" x2="278" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#m55082050)"/><defs><marker id="m25665311" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="232" y1="260" x2="278" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#m25665311)"/><defs><marker id="m3010355" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="482" y1="205" x2="558" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m3010355)"/><text x="520.0" y="197.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">merge</text><defs><marker id="m98238158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="722" y1="205" x2="778" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#m98238158)"/><rect x="30" y="325" width="900" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="60" y="357" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">See it with:</text><text x="170" y="357" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#2563EB" text-anchor="start">mvn help:effective-pom</text><text x="910" y="357" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#B91C1C" text-anchor="end">Edit pom.xml, never the effective POM</text></svg>