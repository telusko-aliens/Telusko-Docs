<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><rect x="0.5" y="0.5" width="959" height="499" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Anatomy of pom.xml</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Everything sits inside the &lt;project&gt; root element</text><rect x="30" y="100" width="900" height="385" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><text x="50" y="130" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#334155" text-anchor="start">&lt;project&gt;</text><rect x="60" y="145" width="600" height="68" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="80" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">Coordinates</text><text x="80" y="195" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">modelVersion, groupId, artifactId, version, packaging</text><rect x="690" y="164.0" width="220" height="30" rx="15.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="800.0" y="183.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">who am I</text><rect x="60" y="223" width="600" height="68" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="80" y="250" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">properties</text><text x="80" y="273" font-family="'JetBrains Mono'