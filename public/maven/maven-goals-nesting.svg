<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Each Goal Runs Everything Before It</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Asking for a later phase automatically runs the earlier ones</text><rect x="40" y="110" width="880" height="200" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="60" y="138" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">mvn package</text><rect x="60" y="152" width="600" height="140" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="80" y="178" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">mvn test</text><rect x="80" y="192" width="300" height="84" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="100" y="218" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">mvn compile</text><text x="100" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">.java -&gt; target/classes</text><text x="400" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">compile tests, run them</text><text x="400" y="242" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">reports: target/surefire-reports</text><text x="690" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">build the archive:</text><text x="690" y="212" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">target/telusko-app-</text><text x="690" y="230" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">1.0-SNAPSHOT.jar</text><rect x="40" y="330" width="280" height="70" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="180.0" y="358.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">mvn clean</text><text x="180.0" y="383.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">deletes target/ only</text><rect x="360" y="330" width="560" height="70" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="640.0" y="358.55" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">mvn clean package</text><text x="640.0" y="383.95" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">the everyday command: fresh target/, then compile, test, package</text></svg>