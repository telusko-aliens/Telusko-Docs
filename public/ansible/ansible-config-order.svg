<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Where Ansible Looks for ansible.cfg</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Searched top to bottom. The first file found is used and all others are ignored.</text><rect x="60" y="105" width="840" height="50" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><rect x="76" y="117" width="30" height="26" rx="13.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="91.0" y="134.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">1</text><text x="124" y="137" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">ANSIBLE_CONFIG</text><text x="440" y="137" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">environment variable pointing to a file</text><rect x="60" y="167" width="840" height="50" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><rect x="76" y="179" width="30" height="26" rx="13.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="91.0" y="196.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">2</text><text x="124" y="199" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">./ansible.cfg</text><text x="440" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">in the current working directory</text><rect x="60" y="229" width="840" height="50" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><rect x="76" y="241" width="30" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="91.0" y="258.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">3</text><text x="124" y="261" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">~/.ansible.cfg</text><text x="440" y="261" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">hidden file in your home directory</text><rect x="60" y="291" width="840" height="50" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><rect x="76" y="303" width="30" height="26" rx="13.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="91.0" y="320.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">4</text><text x="124" y="323" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">/etc/ansible/ansible.cfg</text><text x="440" y="323" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">system-wide file</text><text x="480" y="372" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Run  ansible --version  to see which config file is active (the 'config file =' line).</text></svg>