<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Where a Variable Gets Its Value (Simplified)</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Ansible has 22 precedence levels. These are the ones you meet first. Higher row wins.</text><rect x="130" y="100" width="800" height="46" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="150" y="129" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">extra vars (command line)</text><text x="480" y="129" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">-e package_name=httpd</text><rect x="130" y="156" width="800" height="46" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="150" y="185" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">set_fact, include_vars</text><text x="480" y="185" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">values set while the play runs</text><rect x="130" y="212" width="800" height="46" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="150" y="241" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">play vars_files</text><text x="480" y="241" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">vars_files: [secrets.yml]</text><rect x="130" y="268" width="800" height="46" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="150" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">play vars</text><text x="480" y="297" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">vars: { package_name: httpd }</text><rect x="130" y="324" width="800" height="46" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="150" y="353" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">host_vars / group_vars</text><text x="480" y="353" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">per host or per inventory group</text><rect x="130" y="380" width="800" height="46" rx="10" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="150" y="409" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start">role defaults</text><text x="480" y="409" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">roles/x/defaults/main.yml</text><defs><marker id="m70162664" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><line x1="60" y1="425" x2="60" y2="104" stroke="#D97757" stroke-width="3" marker-end="url(#m70162664)"/><text x="72" y="256" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97757" text-anchor="start">higher</text><text x="72" y="272" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97757" text-anchor="start">priority</text><text x="530" y="458" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">So -e always overrides a value written under vars: inside the playbook.</text></svg>