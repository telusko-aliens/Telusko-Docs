<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Idempotence: Check First, Change Only If Needed</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">What a well-behaved module does on every run</text><rect x="30" y="170" width="180" height="90" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="120.0" y="199.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Task runs</text><text x="120.0" y="225.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">for example</text><text x="120.0" y="242.64999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">install git</text><rect x="270" y="160" width="220" height="110" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="380.0" y="198.05" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Desired state?</text><text x="380.0" y="224.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">is git already</text><text x="380.0" y="243.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">installed?</text><defs><marker id="m59657344" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="212" y1="215" x2="268" y2="215" stroke="#2563EB" stroke-width="2" marker-end="url(#m59657344)"/><rect x="580" y="100" width="340" height="110" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="750.0" y="138.4" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Yes: do nothing</text><text x="750.0" y="165.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">reports ok (green)</text><text x="750.0" y="184.1" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">changed=0 in PLAY RECAP</text><rect x="580" y="240" width="340" height="110" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="750.0" y="278.4" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">No: make the change</text><text x="750.0" y="305.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">reports changed (yellow)</text><text x="750.0" y="324.09999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">changed=1 in PLAY RECAP</text><defs><marker id="m78847783" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="492" y1="195" x2="578" y2="155" stroke="#15803D" stroke-width="2" marker-end="url(#m78847783)"/><text x="535.0" y="167.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">yes</text><defs><marker id="m19911366" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="492" y1="235" x2="578" y2="295" stroke="#B45309" stroke-width="2" marker-end="url(#m19911366)"/><text x="535.0" y="287.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">no</text><text x="480" y="392" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Run 1 on a fresh server: changed. Run 2, 3, 4...: ok. Safe to re-run at any time.</text><text x="480" y="418" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Exceptions: shell/command always report changed, and file with state: touch updates timestamps every run.</text></svg>