<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Agentless Push Model</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Nothing runs permanently on the managed nodes. Ansible pushes small programs over SSH.</text><rect x="30" y="130" width="220" height="170" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="140.0" y="191.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Control node</text><text x="140.0" y="216.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">ansible-playbook</text><text x="140.0" y="234.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">playbook + inventory</text><text x="140.0" y="251.7" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">your SSH private key</text><rect x="285" y="112" width="30" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="131.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">1</text><text x="325" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">connect over SSH (port 22)</text><rect x="285" y="156" width="30" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="175.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">2</text><text x="325" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">copy the module (Python) to a temp dir</text><rect x="285" y="200" width="30" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="219.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">3</text><text x="325" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">run it with the remote Python</text><rect x="285" y="244" width="30" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="263.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">4</text><text x="325" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">send back JSON: ok / changed / failed</text><rect x="285" y="288" width="30" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="307.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">5</text><text x="325" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">delete the temp files</text><defs><marker id="m82231138" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="252" y1="215" x2="278" y2="215" stroke="#7C3AED" stroke-width="2" marker-end="url(#m82231138)"/><defs><marker id="m64205085" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="600" y1="215" x2="668" y2="215" stroke="#7C3AED" stroke-width="2" marker-end="url(#m64205085)"/><rect x="670" y="130" width="260" height="170" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="800.0" y="182.79999999999998" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">Managed node</text><text x="800.0" y="208.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">needs only: SSH + Python</text><text x="800.0" y="225.59999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">no Ansible, no agent</text><text x="800.0" y="242.99999999999997" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">public key in</text><text x="800.0" y="260.4" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">~/.ssh/authorized_keys</text><text x="480" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Compare: Puppet and Chef use a pull model with an agent installed on every server.</text><text x="480" y="374" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Ansible needs no agent, so a fresh EC2 instance is ready as soon as SSH works.</text></svg>