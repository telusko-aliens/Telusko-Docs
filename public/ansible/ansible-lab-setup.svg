<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">The Lab: One Control Node, Two Managed Nodes</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Three Amazon Linux EC2 instances in the same VPC and security group</text><rect x="30" y="100" width="330" height="290" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195" y="128" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">control-node</text><rect x="48" y="146" width="294" height="34" rx="17.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195.0" y="167.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">user: ansible (sudo, no password)</text><rect x="48" y="192" width="294" height="34" rx="17.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195.0" y="213.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">python3 + pip + ansible</text><rect x="48" y="238" width="294" height="34" rx="17.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195.0" y="259.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">~/.ssh/id_rsa (private key)</text><rect x="48" y="284" width="294" height="34" rx="17.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195.0" y="305.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">/etc/ansible/hosts (inventory)</text><rect x="48" y="330" width="294" height="34" rx="17.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="195.0" y="351.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">playbooks in /home/ansible</text><rect x="600" y="100" width="330" height="140" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="765" y="128" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">managed-node-1  [webservers]</text><text x="620" y="158" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">user: ansible (sudo, no password)</text><text x="620" y="177" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">~/.ssh/authorized_keys holds the</text><text x="620" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">public key of the control node</text><text x="620" y="215" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">private IP 172.31.9.250</text><defs><marker id="m44870512" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="362" y1="245" x2="598" y2="170" stroke="#7C3AED" stroke-width="2" marker-end="url(#m44870512)"/><rect x="600" y="250" width="330" height="140" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="765" y="278" font-family="'JetBrains Mono', Consola