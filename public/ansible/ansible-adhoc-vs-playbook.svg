<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Ad Hoc Command vs Playbook</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Same modules underneath, different way of asking</text><rect x="30" y="100" width="430" height="290" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="245" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="middle">Ad hoc command</text><rect x="50" y="146" width="390" height="44" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="245" y="174" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="middle">ansible all -m shell -a "uptime"</text><text x="60" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- one module, typed in the terminal</text><text x="60" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- runs once, nothing saved</text><text x="60" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- quick checks: ping, uptime, disk space</text><text x="60" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- tool: ansible</text><rect x="500" y="100" width="430" height="290" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="715" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">Playbook</text><rect x="520" y="146" width="390" height="100" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="534" y="170" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">- hosts: all</text><text x="534" y="190" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  tasks:</text><text x="534" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">    - name: ping to all managed nodes</text><text x="534" y="230" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">      ansible.builtin.ping:</text><text x="530" y="280" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- many tasks, in order, in a YAML file</text><text x="530" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- saved, reviewed in Git, re-run any time</text><text x="530" y="336" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- real configuration work</text><text x="530" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- tool: ansible-playbook</text></svg>