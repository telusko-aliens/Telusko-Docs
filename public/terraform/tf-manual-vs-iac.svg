<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Clicking in the Console vs Writing Infrastructure as Code</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Same EC2 instance, two very different ways of getting it</text><rect x="30" y="100" width="430" height="340" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="245" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="middle">Manual (web console)</text><rect x="48" y="152" width="74" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="85.0" y="170.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Open console</text><defs><marker id="m77077551" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="122" y1="167" x2="129" y2="167" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#m77077551)"/><rect x="130" y="152" width="74" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="167.0" y="170.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Pick AMI</text><defs><marker id="m35665109" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="204" y1="167" x2="211" y2="167" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#m35665109)"/><rect x="212" y="152" width="74" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="249.0" y="170.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Pick type</text><defs><marker id="m19573422" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="286" y1="167" x2="293" y2="167" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#m19573422)"/><rect x="294" y="152" width="74" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="331.0" y="170.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Key pair?</text><defs><marker id="m45222237" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="368" y1="167" x2="375" y2="167" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#m45222237)"/><rect x="376" y="152" width="74" height="30" rx="15.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="413.0" y="170.85" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Launch</text><text x="52" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Repeat every click for 20 servers</text><text x="52" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Easy to forget a step (key pair, tags, port)</text><text x="52" y="282" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Different UI in AWS, Azure and GCP</text><text x="52" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- No history of who changed what</text><text x="52" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Hard to rebuild the same setup again</text><text x="245" y="410" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">slow, error-prone, not repeatable</text><rect x="500" y="100" width="430" height="340" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="715" y="132" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="middle">Infrastructure as Code (Terraform)</text><rect x="520" y="150" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/><text x="532" y="174" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">resource "aws_instance"</text><text x="532" y="193" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  "web" {</text><text x="532" y="212" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  ami   = "ami-..."</text><text x="532" y="231" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">  count = 20</text><text x="532" y="250" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">}</text><defs><marker id="m6402869" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="702" y1="210" x2="752" y2="210" stroke="#15803D" stroke-width="2" marker-end="url(#m6402869)"/><text x="727.0" y="202.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">apply</text><rect x="756" y="160" width="158" height="100" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="835.0" y="194.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">AWS / Azure / GCP</text><text x="835.0" y="219.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">same tool,</text><text x="835.0" y="237.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">different providers</text><text x="522" y="304" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Written once, run any number of times</text><text x="522" y="334" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Stored in Git, reviewed like code</text><text x="522" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Plan shows changes before they happen</text><text x="522" y="394" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">- Destroy and recreate on demand</text><text x="715" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="middle">fast, reviewable, repeatable</text></svg>