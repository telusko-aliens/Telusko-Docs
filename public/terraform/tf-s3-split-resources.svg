<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img"><rect x="0.5" y="0.5" width="959" height="449" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">One Bucket, Several Resources (AWS provider v4 and later)</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Bucket settings moved out of aws_s3_bucket into their own resources</text><rect x="355" y="105" width="250" height="80" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="480.0" y="138.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">aws_s3_bucket</text><text x="480.0" y="164.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">bucket name, tags, force_destroy</text><rect x="15" y="255" width="225" height="80" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="127" y="285" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">aws_s3_bucket_versioning</text><text x="127" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">keep old object versions</text><defs><marker id="m61882092" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="127" y1="253" x2="480" y2="187" stroke="#15803D" stroke-width="2" marker-end="url(#m61882092)"/><rect x="250" y="255" width="225" height="80" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="362" y="285" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">aws_s3_bucket_public_access_block</text><text x="362" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">block all public access</text><defs><marker id="m19077628" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="362" y1="253" x2="480" y2="187" stroke="#B91C1C" stroke-width="2" marker-end="url(#m19077628)"/><rect x="485" y="255" width="225" height="80" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="597" y="285" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">aws_s3_bucket_server_side_</text><text x="597" y="310" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">encryption_configuration</text><defs><marker id="m19450795" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="597" y1="253" x2="480" y2="187" stroke="#7C3AED" stroke-width="2" marker-end="url(#m19450795)"/><rect x="720" y="255" width="225" height="80" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="832" y="285" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">aws_s3_bucket_acl</text><text x="832" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">only if ACLs are needed</text><defs><marker id="m15095491" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="832" y1="253" x2="480" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#m15095491)"/><text x="480" y="362" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">each one points back with   bucket = aws_s3_bucket.my_bucket.id</text><text x="480" y="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Old style: acl, versioning { }, server_side_encryption_configuration { } inside aws_s3_bucket.</text><text x="480" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">They still exist as deprecated arguments and print warnings. Use the separate resources.</text></svg>