<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">The Terraform Workflow</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Write, initialise, check, preview, create, and finally clean up</text><rect x="30" y="130" width="135" height="90" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="97.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">write code</text><text x="97.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">edit .tf files</text><defs><marker id="m38468406" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="166" y1="175" x2="182" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m38468406)"/><rect x="183" y="130" width="135" height="90" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="250.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">init</text><text x="250.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">download providers</text><defs><marker id="m99950910" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="319" y1="175" x2="335" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m99950910)"/><rect x="336" y="130" width="135" height="90" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="403.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">fmt / validate</text><text x="403.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">tidy and check</text><defs><marker id="m17324588" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="472" y1="175" x2="488" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m17324588)"/><rect x="489" y="130" width="135" height="90" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="556.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">plan</text><text x="556.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">preview changes</text><defs><marker id="m97642478" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="625" y1="175" x2="641" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m97642478)"/><rect x="642" y="130" width="135" height="90" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="709.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">apply</text><text x="709.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">create / update</text><defs><marker id="m13283613" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="778" y1="175" x2="794" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#m13283613)"/><rect x="795" y="130" width="135" height="90" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="862.5" y="168.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">destroy</text><text x="862.5" y="194.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">delete everything</text><defs><marker id="m31562433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><path d="M709.5,222 Q400,300 97.5,222" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#m31562433)"/><text x="401.75" y="281.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">change the code and repeat plan + apply</text><text x="480" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">init runs once per folder (and again when providers or modules change). plan and apply run on every change.</text></svg>