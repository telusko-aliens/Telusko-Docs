<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Where a Variable Gets Its Value</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">If the same variable is set in several places, the higher row wins</text><rect x="130" y="100" width="800" height="46" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="150" y="129" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">-var / -var-file on the command line</text><text x="470" y="129" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">terraform apply -var="instance_type=t3.micro"</text><rect x="130" y="156" width="800" height="46" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="150" y="185" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">*.auto.tfvars files</text><text x="470" y="185" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">loaded automatically, in alphabetical order</text><rect x="130" y="212" width="800" height="46" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="150" y="241" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">terraform.tfvars(.json)</text><text x="470" y="241" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">instance_type = "t3.micro"</text><rect x="130" y="268" width="800" height="46" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="150" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">Environment variables</text><text x="470" y="297" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">export TF_VAR_instance_type=t3.micro</text><rect x="130" y="324" width="800" height="46" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="150" y="353" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">default in the variable block</text><text x="470" y="353" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">default = "t2.micro"</text><rect x="130" y="380" width="800" height="46" rx="10" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="150" y="409" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start">Nothing set anywhere</text><text x="470" y="409" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Terraform asks you at the prompt</text><defs><marker id="m59785548" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><line x1="40" y1="420" x2="40" y2="104" stroke="#D97757" stroke-width="3" marker-end="url(#m59785548)"/><text x="52" y="256" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97757" text-anchor="start">higher</text><text x="52" y="272" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97757" text-anchor="start">priority</text></svg>