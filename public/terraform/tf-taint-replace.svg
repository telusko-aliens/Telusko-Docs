<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Forcing Terraform to Recreate a Resource</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Normally an unchanged resource is left alone. Taint or -replace marks it for replacement.</text><rect x="30" y="110" width="200" height="90" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="130.0" y="139.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Resource is healthy</text><text x="130.0" y="164.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">apply: No changes</text><text x="130.0" y="182.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">0 to add</text><rect x="30" y="290" width="200" height="90" rx="12" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="130.0" y="319.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">Resource is broken</text><text x="130.0" y="344.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">code unchanged, so</text><text x="130.0" y="362.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">apply still does nothing</text><defs><marker id="m96915892" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs><line x1="130" y1="202" x2="130" y2="288" stroke="#B91C1C" stroke-width="2" marker-end="url(#m96915892)"/><text x="140" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">something</text><text x="140" y="256" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">goes wrong</text><rect x="290" y="100" width="330" height="170" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="455" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Old way (deprecated)</text><rect x="310" y="145" width="290" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="455.0" y="163.85" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">terraform taint aws_instance.linux-VM</text><text x="455" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">marks the resource as tainted in the state</text><rect x="310" y="215" width="290" height="30" rx="15.0" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="455.0" y="234.2" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">terraform apply</text><rect x="290" y="300" width="330" height="120" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="455" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Recommended since v0.15.2</text><rect x="310" y="345" width="290" height="30" rx="15.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="455.0" y="363.85" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">apply -replace="aws_instance.linux-VM"</text><text x="455" y="404" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">one step, and you see the plan first</text><defs><marker id="m91670811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="232" y1="320" x2="288" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#m91670811)"/><defs><marker id="m9457008" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="232" y1="350" x2="288" y2="360" stroke="#15803D" stroke-width="2" marker-end="url(#m9457008)"/><rect x="680" y="190" width="250" height="140" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="805.0" y="218.4" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Plan: 1 to add, 1 to destroy</text><text x="805.0" y="243.8" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">-/+ must be replaced</text><text x="805.0" y="261.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle"></text><text x="805.0" y="278.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">1. destroy old instance</text><text x="805.0" y="296.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">2. create new instance</text><text x="805.0" y="313.4" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">(new ID, new public IP)</text><defs><marker id="m60779010" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="622" y1="230" x2="678" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#m60779010)"/><defs><marker id="m83004508" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><line x1="622" y1="360" x2="678" y2="300" stroke="#15803D" stroke-width="2" marker-end="url(#m83004508)"/><text x="480" y="455" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">terraform untaint removes the mark if you change your mind before applying.</text></svg>