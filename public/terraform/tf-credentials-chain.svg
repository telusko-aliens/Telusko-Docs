<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img"><rect x="0.5" y="0.5" width="959" height="489" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Where the AWS Provider Looks for Credentials</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Checked from top to bottom. The first source that has credentials wins.</text><rect x="40" y="100" width="880" height="48" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><rect x="54" y="111" width="30" height="26" rx="13.0" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="69.0" y="128.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">1</text><text x="100" y="130" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">Provider block</text><text x="310" y="130" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">access_key / secret_key in .tf</text><text x="900" y="130" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="end">never do this</text><rect x="40" y="158" width="880" height="48" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><rect x="54" y="169" width="30" height="26" rx="13.0" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="69.0" y="186.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">2</text><text x="100" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">Environment variables</text><text x="310" y="188" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_PROFILE</text><text x="900" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="end">ok for a session</text><rect x="40" y="216" width="880" height="48" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><rect x="54" y="227" width="30" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="69.0" y="244.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">3</text><text x="100" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">Shared credentials file</text><text x="310" y="246" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">~/.aws/credentials (written by aws configure)</text><text x="900" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="end">good for laptops</text><rect x="40" y="274" width="880" height="48" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><rect x="54" y="285" width="30" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="69.0" y="302.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">4</text><text x="100" y="304" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">Shared config file</text><text x="310" y="304" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">~/.aws/config (profiles, SSO, region)</text><text x="900" y="304" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="end">best with SSO</text><rect x="40" y="332" width="880" height="48" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><rect x="54" y="343" width="30" height="26" rx="13.0" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="69.0" y="360.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">5</text><text x="100" y="362" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">Container credentials</text><text x="310" y="362" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">ECS task role, EKS pod identity</text><text x="900" y="362" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="end">for containers</text><rect x="40" y="390" width="880" height="48" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><rect x="54" y="401" width="30" height="26" rx="13.0" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="69.0" y="418.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">6</text><text x="100" y="420" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">Instance profile</text><text x="310" y="420" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">IAM role attached to the EC2 instance</text><text x="900" y="420" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7C3AED" text-anchor="end">best on EC2</text><text x="480" y="468" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Terraform never needs the keys inside your code. Let the provider find them.</text></svg>