<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="480.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">How User Data Turns an EC2 Instance into a Web Server</text><text x="480.0" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Terraform only hands the script to AWS. The instance runs it on first boot.</text><rect x="30" y="110" width="190" height="70" rx="12" fill="#EEF2F6" stroke="#334155" stroke-width="1.5"/><text x="125.0" y="138.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">installHttpd.sh</text><text x="125.0" y="163.6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">bash script</text><rect x="30" y="200" width="190" height="70" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.5"/><text x="125.0" y="228.925" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">main.tf</text><text x="125.0" y="252.875" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">user_data = file(...)</text><defs><marker id="m19247408" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="125" y1="182" x2="125" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#m19247408)"/><rect x="270" y="155" width="170" height="80" rx="12" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/><text x="355.0" y="179.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">terraform apply</text><text x="355.0" y="204.9" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">RunInstances API</text><text x="355.0" y="222.3" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">with user data</text><defs><marker id="m51214800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><line x1="222" y1="235" x2="268" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#m51214800)"/><rect x="490" y="100" width="260" height="220" rx="12" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">EC2 instance (first boot)</text><rect x="520" y="142" width="200" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620.0" y="159.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">cloud-init starts</text><rect x="520" y="176" width="200" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620.0" y="193.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">runs script as root</text><rect x="520" y="210" width="200" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620.0" y="227.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">yum install httpd</text><rect x="520" y="244" width="200" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620.0" y="261.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">writes index.html</text><rect x="520" y="278" width="200" height="26" rx="13.0" fill="#E7F6EC" stroke="#15803D" stroke-width="1.5"/><text x="620.0" y="295.2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">starts httpd on :80</text><defs><marker id="m92860691" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><line x1="442" y1="195" x2="488" y2="195" stroke="#7C3AED" stroke-width="2" marker-end="url(#m92860691)"/><rect x="800" y="155" width="130" height="80" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/><text x="865.0" y="188.925" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Browser</text><text x="865.0" y="212.875" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">http://public-ip</text><defs><marker id="m38247010" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><line x1="798" y1="195" x2="752" y2="195" stroke="#B45309" stroke-width="2" marker-end="url(#m38247010)"/><rect x="780" y="255" width="170" height="54" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/><text x="865" y="277" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">security group must</text><text x="865" y="295" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">allow port 80 inbound</text><text x="480" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">User data runs only once, at the first boot. Changing it later means a stop/start or a new instance.</text><text x="480" y="395" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Logs on the instance: /var/log/cloud-init-output.log</text></svg>